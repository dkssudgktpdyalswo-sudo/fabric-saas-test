<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>백야 데이터 내보내기 (읽기 전용)</title>
<style>
  body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; max-width: 520px; margin: 40px auto; padding: 0 20px; color: #2b2b2b; line-height: 1.6; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #777; font-size: 14px; margin-bottom: 24px; }
  button { width: 100%; padding: 16px; font-size: 17px; font-weight: 600; border: none; border-radius: 12px; background: #2b2b2b; color: #fff; }
  button:disabled { background: #aaa; }
  #log { margin-top: 20px; font-size: 14px; white-space: pre-wrap; background: #f6f4f2; border-radius: 10px; padding: 14px; min-height: 40px; }
  .warn { margin-top: 18px; font-size: 13px; color: #a15c1e; background: #fff3d6; border-radius: 10px; padding: 12px; }
</style>
</head>
<body>
<h1>백야 데이터 내보내기</h1>
<div class="sub">지금 쓰는 백야 장부를 <b>읽기만</b> 해서 파일 하나로 내려받습니다. 저장·수정·삭제 기능은 이 페이지에 아예 없습니다.</div>
<button id="go" onclick="run()">내보내기 시작</button>
<div id="log">버튼을 누르면 시작합니다.</div>
<div class="warn">내려받은 파일에는 거래처·매출·원가가 모두 들어 있습니다. 개발 담당 외에는 보내지 마세요.</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// 백야가 지금 쓰는 Firebase (index.html과 같은 설정). 이 페이지는 .get() 읽기만 씀 - set/update/delete 호출 없음
const cfg = { apiKey: "AIzaSyA4Qrz16VpQuBVxTzGMyoAD9BtzIgXV0cQ", projectId: "project-8895328122777928786", appId: "1:995742705102:web:7294216d6e4745dd1df79f" };
const COLLECTIONS = ['inventory', 'inventory_archive']; // 장부·재고·설정·공개문서 / 보관함 (백업 컬렉션은 양이 많아 제외)
const MAIN_DOCS = ['rolls', 'costs', 'settings', 'orders', 'chinaOrders', 'chinaProductMap', 'swatchInfo', 'shipmentLog', 'priceBook', 'depositMemos', 'customerNotes', 'customerList', 'expenses'];
const logEl = document.getElementById('log');
const say = (t) => { logEl.textContent += '\n' + t; };

async function run() {
  const btn = document.getElementById('go'); btn.disabled = true; logEl.textContent = '연결 중...';
  try {
    firebase.initializeApp(cfg);
    const db = firebase.firestore();
    try { await firebase.auth().signInAnonymously(); } catch (e) { /* 규칙이 열려 있으면 인증 없이도 읽힘 */ }
    const out = { source: 'baekya', exportedAt: new Date().toISOString(), docs: {}, archive: {} };
    for (const col of COLLECTIONS) {
      const snap = await db.collection(col).get({ source: 'server' }); // 폰에 남은 예전 사본이 아니라 서버의 최신값만
      snap.forEach(d => { (col === 'inventory' ? out.docs : out.archive)[d.id] = d.data(); });
      say(`${col}: 문서 ${snap.size}개 읽음`);
    }
    const missing = MAIN_DOCS.filter(k => !out.docs[k]);
    if (missing.length) say('⚠️ 없는 장부 문서: ' + missing.join(', ') + ' (원래 없던 거면 괜찮음)');
    const text = JSON.stringify(out);
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    const ts = new Date(); const p = (n) => String(n).padStart(2, '0');
    a.href = URL.createObjectURL(blob);
    a.download = `baekya-export-${ts.getFullYear()}${p(ts.getMonth() + 1)}${p(ts.getDate())}-${p(ts.getHours())}${p(ts.getMinutes())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    say(`완료: ${Math.round(text.length / 1024)}KB 파일을 내려받았습니다.`);
  } catch (e) {
    say('❌ 실패: ' + (e && e.message ? e.message : e) + '\n인터넷 연결을 확인하고 다시 눌러주세요. 백야 데이터는 바뀌지 않았습니다.');
    btn.disabled = false;
  }
}
</script>
</body>
</html>
