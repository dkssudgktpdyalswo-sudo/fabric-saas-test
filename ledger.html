<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#efeaea">
<title>거래 장부</title>
<style>
:root{--ink:#3a3636;--brand:#595959;--muted:#7d7676;--hair:#ddd5d5;--paper:#efeaea;--strip:#f6f2f2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
body{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:2px solid var(--brand)}
.brand{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}.brand img{height:20px;display:block}.brand .loc{font-size:12px;color:var(--muted)}
.tabs{display:flex;padding:0 8px}.tabs button{flex:1;text-align:center;padding:11px 0 12px;font-size:16px;font-weight:700;color:var(--muted);border:none;background:none;border-bottom:3px solid transparent;margin-bottom:-2px}.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.asof{font-size:12px;color:var(--muted);padding:12px 16px 0}
.hero{margin:10px 14px 0;background:#fff;border:1px solid var(--hair);color:var(--ink);border-radius:12px;padding:12px 16px}
.hero .l{font-size:12.5px;color:var(--muted)}.hero .n{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-top:2px}.hero .n small{font-size:14px;font-weight:700;margin-left:2px}
.hero .s{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.5}
.acct{margin:10px 14px 0;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.acct .t{min-width:0;word-break:break-all}.acct small{display:block;font-size:12px;color:var(--muted)}.acct b{font-size:15px}
.acct button{flex:none;font-size:12px;font-weight:700;background:#e6e1e1;border:none;border-radius:6px;padding:6px 10px;color:var(--ink)}
.row.x{cursor:pointer}.row .chv{color:#b5adad;font-size:18px;margin-left:8px;display:inline-block;transition:transform .15s}.row.op{border-radius:12px 12px 0 0;margin-bottom:0}.row.op .chv{transform:rotate(180deg)}
.dcard{margin:0 14px;background:#fff;border:1px solid var(--hair);border-top:1px solid var(--strip);border-radius:0 0 12px 12px;overflow:hidden}
.expall{margin-left:auto;align-self:center;border:none;background:none;font-size:13px;font-weight:700;color:var(--muted);padding:6px 2px}
.sh{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.mm{font-size:12.5px;color:#2f7a52;font-weight:700;margin-top:3px;line-height:1.5}
.sec{font-size:13px;font-weight:800;color:var(--muted);padding:16px 16px 4px;letter-spacing:.3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:12px 14px;margin:8px 14px 0}
.row .a{font-size:15px;font-weight:800}.row .b{font-size:12.5px;color:var(--muted);margin-top:3px}
.row .r{text-align:right;font-size:16px;font-weight:800;white-space:nowrap}.row .r.in{color:#2f7a52}
.chip{display:inline-block;font-size:11.5px;font-weight:800;border-radius:5px;padding:1px 7px;background:#e6e1e1;color:#7d7676;margin-left:6px}
.chip.ok{background:#dfeee5;color:#2f7a52}.chip.wait{background:#f3e8cf;color:#8a6414}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:16px 16px 0}.day b{font-size:15px}.day span{font-size:13px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--hair);border-radius:12px;margin:8px 14px 0;overflow:hidden}
.li{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-top:1px solid var(--strip)}.li:first-child{border-top:none}
.li .a{font-size:15px;font-weight:800;word-break:keep-all;overflow-wrap:anywhere}.li .b{font-size:12.5px;color:var(--muted);margin-top:2px}
.li .r{text-align:right;font-size:15px;font-weight:800;white-space:nowrap}.li .r.neg{color:#2f7a52}
.mon{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}.mon .m{font-size:17px;font-weight:800}.mon .t{font-size:13px;color:var(--muted)}
.pill{display:flex;gap:8px;padding:10px 14px 0}.pill button{font-size:13px;font-weight:700;padding:6px 14px;border-radius:16px;background:#e3dcdc;color:var(--muted);border:none}.pill button.on{background:var(--brand);color:#fff}
.ft{font-size:12px;color:var(--muted);text-align:center;padding:14px 16px 0;line-height:1.6}
.empty,.msg{text-align:center;color:var(--muted);font-size:15px;padding:64px 20px;line-height:1.7}
.msg button{margin-top:14px;border:none;background:var(--brand);color:#fff;border-radius:10px;padding:11px 22px;font-size:15px;font-weight:700}
.pin{max-width:320px;margin:60px auto 0;padding:0 20px;text-align:center}
.pin img{height:24px;margin-bottom:18px}.pin .nm{font-size:20px;font-weight:800;margin-bottom:4px}.pin .ds{font-size:14px;color:var(--muted);margin-bottom:16px}
.pin input{width:100%;font-size:22px;text-align:center;letter-spacing:6px;padding:12px;border:1px solid var(--hair);border-radius:12px;background:#fff;color:var(--ink);outline:none}
.pin button{width:100%;margin-top:10px;border:none;background:var(--brand);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:800}
.pin .er{color:#b5483a;font-size:13px;margin-top:10px;min-height:18px}
.pin2{max-width:320px;margin:70px auto 0;padding:0 20px;text-align:center}
.pin2 img{width:210px;height:auto;display:block;margin:0 auto 34px}
.pin2 .ds{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:18px}
.pin2 .bx{position:relative;display:flex;gap:7px;justify-content:center}
.pin2 .bx i{flex:1;max-width:44px;height:54px;border:1px solid var(--hair);border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;font-weight:800}
.pin2 .bx i.on{border-color:var(--brand)}
.pin2 .bx input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0}
.pin2 button{width:100%;margin-top:16px;border:none;background:var(--brand);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:800}
.pin2 button:disabled{opacity:.45}
.pin2 .er{color:#b5483a;font-size:13px;margin-top:10px;min-height:18px}
.pin2 .ft2{font-size:12px;color:var(--muted);margin-top:26px}
.t2{display:flex;gap:10px;align-items:flex-start;padding:12px 14px 0}
.t2 .lf{flex:1;min-width:0}.t2 .lf .m{font-size:17px;font-weight:800}.t2 .lf .t{font-size:13px;color:var(--muted);margin-top:2px}
.t2 .pill{padding:10px 0 0;flex-direction:column;align-items:flex-start;gap:6px}.t2 .pill button{padding:6px 12px}
.mc{flex:none;width:238px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:8px 6px 6px;user-select:none;-webkit-user-select:none}
.mc .hd{display:flex;align-items:center;justify-content:space-between;padding:0 6px 4px;font-size:14px;font-weight:800}.mc .hd span{font-size:20px;color:var(--muted);font-weight:400;padding:0 6px;line-height:1}
.mc .g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.mc .w{font-size:10.5px;color:var(--muted);padding-bottom:2px}.mc .w.su{color:#b5483a}
.mc .d{height:33px;font-size:12.5px;position:relative;padding-top:7px;border-radius:9px}
.mc .d.has{font-weight:800}.mc .d.has::after{content:'';position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#2f7a52}
.mc .d.today span{border-bottom:2px solid var(--brand)}
.mc .d.sel{background:var(--brand);color:#fff}.mc .d.sel::after{background:#fff}
.fl{display:flex;align-items:center;justify-content:space-between;margin:12px 14px 0;background:#e3dcdc;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:700}.fl b{font-size:15px;color:var(--muted);padding:0 4px}
@media(min-width:600px){.mc{width:380px}.mc .d{height:44px;font-size:15px;padding-top:11px}.mc .w{font-size:12px}.mc .hd{font-size:16px}.t2 .pill{flex-direction:row}}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--hair);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.bar a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;max-width:342px;background:var(--brand);color:#fff;border-radius:12px;padding:14px 0;font-size:16px;font-weight:800;white-space:nowrap}
.ft a{text-decoration:underline}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:86px;z-index:30;background:rgba(25,25,25,.92);color:#fff;font-size:14px;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="bar" id="bar"><a id="shoplink" href="customer.html?p=new">✨ 신상 · Best 품목 보러가기</a></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
let LOGO = ''; // [새 시스템] 가게 로고 - 가게의 공개 정보(public/brand)에서 읽음
let BRAND = { name: '', loc: '', tel: '', kakaoUrl: '' };
async function loadBrand() { // 실패해도 페이지는 그대로 보이게
  try { const d = await pubDocs().doc('brand').get(); if (d.exists) { const o = d.data(); BRAND = { name: String(o.name || ''), loc: String(o.loc || ''), tel: String(o.tel || ''), kakaoUrl: /^https:\/\//.test(o.kakaoUrl || '') ? o.kakaoUrl : '' }; LOGO = /^data:image\//.test(o.logo || '') ? o.logo : ''; } } catch (e) { /* 기본값 */ }
}
function logoHtml() { return LOGO ? `<img src="${LOGO}" alt="${esc(BRAND.name)}">` : `<b style="font-size:20px;letter-spacing:1px;">${esc(BRAND.name)}</b>`; }
const cfg = { apiKey: "AIzaSyCeWjdi2yBaBsiVSydDYHDAmQAT4hsGs6I", authDomain: "fabric-saas-test.firebaseapp.com", projectId: "fabric-saas-test", appId: "1:93481473112:web:5f88067e0e01dfba24e62d" }; // [새 시스템] 새 Firebase 프로젝트 설정값
const SHOP_ID = (() => { try { const v = new URLSearchParams(location.search).get('shop'); if (v && /^[a-z0-9-]{2,30}$/.test(v)) return v; } catch (e) { /* 기본 가게 */ } return 'baekya'; })(); // [새 시스템] 어느 가게 페이지인지
function pubDocs() { return db.collection('shops').doc(SHOP_ID).collection('public'); } // [새 시스템] 가게별 공개 공간만 읽음
const app = document.getElementById('app');
const TOKEN = new URLSearchParams(location.search).get('t') || '';
try { document.getElementById('shoplink').href = 'customer.html?shop=' + SHOP_ID + '&p=new'; } catch (e) { /* 링크 없으면 그대로 */ } // [새 시스템] 같은 가게 신상 페이지로
let snap = null, tab = 'a', unlocked = false, state = 'load'; // load | none | err | pin | pin2 | ok
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const r2 = v => Math.round(v * 100) / 100;
const monthKey = d => String(d).slice(0, 5); // 'YY.MM'
const nowKey = () => { const d = new Date(); return String(d.getFullYear()).slice(2) + '.' + String(d.getMonth() + 1).padStart(2, '0'); };
const prevKey = () => { const d = new Date(); d.setMonth(d.getMonth() - 1, 1); return String(d.getFullYear()).slice(2) + '.' + String(d.getMonth() + 1).padStart(2, '0'); };
const mmdd = d => String(d).slice(3);
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }
function unb64(t) { const b = atob(t), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
let ENC = null, PIN = '';
async function decryptWith(pin) { // 비밀번호로 암호를 풀어 장부를 돌려줌 (틀리면 null)
  try {
    const te = new TextEncoder(), base = await crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: te.encode(TOKEN), iterations: 210000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(ENC.i) }, key, unb64(ENC.c));
    const o = JSON.parse(new TextDecoder().decode(pt));
    return (o && Array.isArray(o.ev)) ? o : null;
  } catch (e) { return null; }
}
async function sha(str) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return null; }
}
function head() {
  const tabs = [['a', '출고내역'], ['c', '이월']];
  return `<div class="top"><div class="brand">${logoHtml()}<span class="loc">${esc(snap.name)} 귀하</span></div><div class="tabs">${tabs.map(([k, n]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${n}</button>`).join('')}</div></div>`;
}
function asOfText() { const d = new Date(snap.asOf); if (isNaN(d)) return ''; return `${d.getMonth() + 1}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} 업데이트`; }
const ranges = { a: 'cur', b: 'cur', c: 'all' }; // 이월은 지난달에 발주한 대기 건이 안 가려지게 처음엔 '전체'
function inRange(d, r) { return r === 'all' || monthKey(d) === (r === 'cur' ? nowKey() : prevKey()); }
function rangeTitle(r) { return r === 'all' ? '전체' : `20${(r === 'cur' ? nowKey() : prevKey()).replace('.', '년 ')}월`; }
function pills(t) { return `<div class="pill">${[['cur', '이번 달'], ['prev', '지난달'], ['all', '전체']].map(([k, n]) => `<button data-range="${k}" class="${k === ranges[t] ? 'on' : ''}">${n}</button>`).join('')}</div>`; }
const openDays = new Set();
function viewA() {
  const ev = snap.ev || [], cur = nowKey();
  let opening = snap.opening || 0, out = 0, inn = 0;
  for (const e of ev) {
    if (monthKey(e.d) < cur) opening += e.a;
    else if (e.t === '입금') inn += -e.a;
    else out += e.a;
  }
  opening = r2(opening); out = r2(out); inn = r2(inn);
  const showFormula = !(snap.credit > 0) && Math.abs(r2(opening + out - inn) - snap.balance) < 0.5; // 계산식이 안 맞으면 보여주지 않음 (헷갈리는 숫자 방지)
  const big = snap.credit > 0 ? snap.credit : snap.balance;
  const hero = `<div class="l">${snap.credit > 0 ? '선수금' : '현재 미수금'}</div><div class="n">${Math.round(big).toLocaleString('ko-KR')}<small>원</small></div>`;
  const formula = showFormula ? `<div class="s">지난달까지 ${won(opening)} + 이번 달 출고 ${won(out)} - 이번 달 입금 ${won(inn)}</div>` : '';
  const acct = snap.acct ? `<div class="acct"><div class="t"><small>입금계좌</small><b>${esc(snap.acct)}</b></div><button data-copy="1">복사</button></div>` : '';
  // 날짜별로 출고(매출/공제/반품 합) 한 줄 - 누르면 그날 품목이 펼쳐짐, 입금은 한 줄씩
  const list = ev.filter(e => inRange(e.d, ranges.a));
  const days = new Map(); let sOut = 0, sIn = 0;
  for (const e of list) {
    const isIn = e.t === '입금', k = e.d + (isIn ? '|in|' + e.n : '|out');
    if (isIn) sIn += -e.a; else sOut += e.a;
    if (!days.has(k)) days.set(k, { k, d: e.d, isIn, n: isIn ? e.n : '', a: 0, evs: [] });
    const g = days.get(k); g.a += e.a; g.evs.push(e);
  }
  const groups = Array.from(days.values()).sort((a, b) => String(b.d).localeCompare(String(a.d))).slice(0, 120);
  const outKeys = groups.filter(g => !g.isIn).map(g => g.k), allOpen = outKeys.length > 0 && outKeys.every(k => openDays.has(k));
  const rows = groups.map(g => {
    if (g.isIn) return `<div class="row"><div><div class="a">입금</div><div class="b">${esc(mmdd(g.d))} · ${esc(g.n.replace(/^입금\(?/, '').replace(/\)$/, '') || '입금')}</div></div><div class="r in">${won(g.a)}</div></div>`;
    const names = g.evs.filter(e => e.t === '매출').map(e => e.c ? '이월 미수금' : e.n), first = names[0] || '출고', more = names.length > 1 ? ` 외 ${names.length - 1}건` : '';
    const open = openDays.has(g.k);
    const head = `<div class="row x${open ? ' op' : ''}" data-day="${esc(g.k)}"><div><div class="a">출고</div><div class="b">${esc(mmdd(g.d))} · ${esc(first)}${more}</div></div><div class="r">${won(g.a)}<span class="chv">⌄</span></div></div>`;
    if (!open) return head;
    return head + `<div class="dcard">${g.evs.map(e => {
      const sale = e.t === '매출';
      return `<div class="li"><div><div class="a">${esc(e.c ? '이월 미수금' : e.n)}${sale ? '' : ` <span class="chip">${esc(e.t)}</span>`}</div>${e.q ? `<div class="b">${esc(e.q)}</div>` : ''}</div><div class="r${e.a < 0 ? ' neg' : ''}">${won(e.a)}</div></div>`;
    }).join('')}</div>`;
  }).join('');
  const pl = pills('a').replace('</div>', outKeys.length ? `<button class="expall" data-expall="1">${allOpen ? '전체 접기' : '전체 펼치기'}</button></div>` : '</div>');
  return `<div class="asof">${esc(asOfText())}</div><div class="hero">${hero}${formula}</div>${acct}<div class="mon" style="padding-top:18px"><span class="m">${esc(rangeTitle(ranges.a))}</span><span class="t">출고 ${won(sOut)} · 입금 ${won(sIn)}</span></div>${pl}${rows || '<div class="empty" style="padding:30px 0">내역이 없어요</div>'}<div class="ft">금액이 다르다면 ${BRAND.kakaoUrl ? `<a href="${esc(BRAND.kakaoUrl)}">채널로 문의</a>해 주세요` : '가게로 문의해 주세요'}</div>`;
}
function qty(n, u) { return `${r2(n).toLocaleString('ko-KR')}${u}`; }
// 이월 달력: 메모에 적힌 날짜를 읽어서 달력에 올림 (날짜를 못 읽으면 '날짜 없는 건')
let calY = 0, calM = 0, calSel = '';
const pad2 = n => String(n).padStart(2, '0');
const dkey = (y, m, d) => y + '-' + pad2(m) + '-' + pad2(d);
const todayD = () => window.__TODAY || new Date();
const validMD = (y, m, d) => m >= 1 && m <= 12 && d >= 1 && d <= new Date(y, m, 0).getDate();
function memoDate(txt, now) {
  const t = String(txt || ''); if (!t) return '';
  const ty = now.getFullYear(), tm = now.getMonth() + 1, td = now.getDate(), cands = [];
  let m, re;
  const spans = [];
  re = /(\d{1,2})\s*월\s*(\d{1,2})\s*일/g; while ((m = re.exec(t))) { cands.push({ i: m.index, mo: +m[1], d: +m[2], hasM: true }); spans.push([m.index, m.index + m[0].length]); }
  re = /(^|[^\d./])(\d{1,2})\s*[./]\s*(\d{1,2})(?!\d|\s*[yYmM절롤장개%])/g; while ((m = re.exec(t))) cands.push({ i: m.index + m[1].length, mo: +m[2], d: +m[3], hasM: true });
  re = /(^|[^\d])(\d{1,2})\s*일(?!\s*(후|뒤|이내|간|동안))/g; while ((m = re.exec(t))) { const ix = m.index + m[1].length; if (!spans.some(p => ix >= p[0] && ix < p[1])) cands.push({ i: ix, mo: 0, d: +m[2], hasM: false }); }
  cands.sort((a, b) => a.i - b.i);
  for (const c of cands) {
    if (c.hasM) {
      let y = ty; if (!validMD(y, c.mo, c.d)) continue;
      if ((now - new Date(y, c.mo - 1, c.d)) / 86400000 > 180) { y++; if (!validMD(y, c.mo, c.d)) continue; }
      return dkey(y, c.mo, c.d);
    }
    let y = ty, mo = tm; if (c.d < td) { mo++; if (mo > 12) { mo = 1; y++; } }
    for (let n = 0; n < 3; n++) { if (validMD(y, mo, c.d)) return dkey(y, mo, c.d); mo++; if (mo > 12) { mo = 1; y++; } }
  }
  return '';
}
function calMini(os) { // 오른쪽 위 작은 달력: 예정 있는 날에 점, 누르면 그날 품목만 목록에 보임
  const t = todayD(), tk = dkey(t.getFullYear(), t.getMonth() + 1, t.getDate()), has = new Set();
  for (const o of os) { const k = memoDate(o.m, t); if (k) has.add(k); }
  if (!calY) { calY = t.getFullYear(); calM = t.getMonth() + 1; }
  const lead = new Date(calY, calM - 1, 1).getDay(), last = new Date(calY, calM, 0).getDate();
  let cells = '<div class="w su">일</div>' + ['월', '화', '수', '목', '금', '토'].map(n => `<div class="w">${n}</div>`).join('') + '<div></div>'.repeat(lead);
  for (let d = 1; d <= last; d++) { const k = dkey(calY, calM, d); cells += `<div class="d${has.has(k) ? ' has' : ''}${k === tk ? ' today' : ''}${k === calSel ? ' sel' : ''}" data-cd="${k}"><span>${d}</span></div>`; }
  return `<div class="mc"><div class="hd"><span data-cal="-1">‹</span>${calY}년 ${calM}월<span data-cal="1">›</span></div><div class="g">${cells}</div></div>`;
}
function viewC() {
  const r = ranges.c;
  const act = (snap.active || []).filter(o => inRange(o.d || '', r));
  const st = o => ({ wait: ['대기', 'wait'], partial: ['부분출고', ''], received_full: ['입고완료', 'ok'] }[o.s] || ['대기', 'wait']);
  const shipTxt = o => {
    const s = (o.sh || []);
    if (s.length) return `<div class="sh">${s.map(x => `${esc(mmdd(x.d))} ${esc(x.q)}`).join(' · ')}</div>`;
    return o.r > 0 ? `<div class="sh">출고 ${qty(o.r, o.u)}</div>` : '';
  };
  const line = o => {
    const remain = o.q > o.r ? o.q - o.r : 0, [lb, cl] = st(o);
    return `<div class="li"><div><div class="a">${esc(o.i)} ${esc(o.c)}</div>${o.q > 0 ? `<div class="b">발주 ${qty(o.q, o.u)}</div>` : ''}${shipTxt(o)}${o.m ? `<div class="mm">${esc(o.m)}</div>` : ''}</div><div class="r">${remain > 0 ? qty(remain, o.u) : (o.q > 0 ? '전량 처리' : '-')}<span class="chip ${cl}" style="display:block;margin:4px 0 0 auto;width:fit-content">${lb}</span></div></div>`;
  };
  const t0 = todayD(), shown = calSel ? act.filter(o => memoDate(o.m, t0) === calSel) : act;
  const byDay = new Map();
  for (const o of shown) { const k = o.d || ''; if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(o); }
  const days = Array.from(byDay.entries()).sort((x, y) => String(y[0]).localeCompare(String(x[0])));
  const selTxt = calSel ? `<div class="fl"><span>${+calSel.slice(5, 7)}.${+calSel.slice(8, 10)} 일정만 보는 중</span><b data-cd="${calSel}">✕</b></div>` : '';
  return `<div class="t2"><div class="lf"><div class="m">${esc(rangeTitle(r))}</div><div class="t">진행 중 ${act.length}건</div>${pills('c')}</div>${calMini(act)}</div>${selTxt}`
    + (days.length ? days.map(([d, os]) => `<div class="day"><b>발주 ${esc(mmdd(d))}</b><span>${os.length}건</span></div><div class="card">${os.map(line).join('')}</div>`).join('') : `<div class="empty" style="padding:30px 0">${calSel ? '이 날은 예정이 없어요' : '진행 중인 건이 없어요'}</div>`)
    + '<div class="ft">정확한 입고일은 ' + (BRAND.kakaoUrl ? `<a href="${esc(BRAND.kakaoUrl)}">채널로 문의</a>해 주세요` : '가게로 문의해 주세요') + '</div>';
}
function render() {
  const barEl = document.getElementById('bar'); if (barEl) barEl.style.display = (state === 'pin2' || state === 'pin') ? 'none' : '';
  if (state === 'load') { app.innerHTML = '<div class="empty">불러오는 중...</div>'; return; }
  if (state === 'none') { app.innerHTML = '<div class="msg">이 링크는 열리지 않아요.<br>담당자에게 새 링크를 요청해 주세요.</div>'; return; }
  if (state === 'err') { app.innerHTML = '<div class="msg">불러오지 못했어요.<br>잠시 후 다시 시도해주세요.<br><button id="retry">다시 불러오기</button></div>'; document.getElementById('retry').onclick = boot; return; }
  if (state === 'pin2') {
    app.innerHTML = `<div class="pin2">${logoHtml()}<div class="ds">비밀번호 6자리를 입력해 주세요</div><div class="bx" id="bx">${'<i></i>'.repeat(6)}<input id="pin" type="tel" inputmode="numeric" maxlength="6" autocomplete="off" autofocus></div><button id="go" disabled>열기</button><div class="er" id="er"></div><div class="ft2">한 번 열면 저장됩니다</div></div>`;
    const inp = document.getElementById('pin'), boxes = document.querySelectorAll('#bx i'), btn = document.getElementById('go'), er = document.getElementById('er');
    const paint = () => { const v = inp.value; boxes.forEach((b, k) => { b.textContent = v[k] ? '●' : ''; b.classList.toggle('on', k === Math.min(v.length, 5)); }); btn.disabled = v.length !== 6; };
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); er.textContent = ''; paint(); });
    const go = async () => {
      const v = inp.value; if (v.length !== 6) return;
      btn.disabled = true; btn.textContent = '확인 중...';
      const o = await decryptWith(v);
      if (o) { snap = o; PIN = v; try { localStorage.setItem('lg2_' + TOKEN, v); } catch (e) { /* 저장 못 해도 열림 */ } state = 'ok'; render(); }
      else { er.textContent = '비밀번호가 맞지 않아요'; inp.value = ''; btn.textContent = '열기'; paint(); inp.focus(); }
    };
    btn.onclick = go; inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); paint();
    return;
  }
  if (state === 'pin') {
    app.innerHTML = `<div class="pin">${logoHtml()}<div class="nm">${esc(snap.name)} 귀하</div><div class="ds">비밀번호를 입력해주세요</div><input id="pin" type="password" inputmode="numeric" autocomplete="off" autofocus><button id="go">확인</button><div class="er" id="er"></div></div>`;
    const go = async () => {
      const v = document.getElementById('pin').value.trim(); if (!v) return;
      const h = await sha(TOKEN + ':' + v);
      if (h && h === snap.pin) { try { localStorage.setItem('lg_' + TOKEN, snap.pin); } catch (e) { /* 저장 못 해도 열림 */ } state = 'ok'; render(); }
      else { document.getElementById('er').textContent = '비밀번호가 맞지 않아요'; document.getElementById('pin').value = ''; }
    };
    document.getElementById('go').onclick = go; document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    return;
  }
  document.title = snap.name + ' 귀하 · ' + BRAND.name;
  app.innerHTML = head() + (tab === 'a' ? viewA() : viewC());
}
document.addEventListener('click', e => {
  const cn = e.target.closest('[data-cal]'); if (cn) { calM += +cn.dataset.cal; if (calM < 1) { calM = 12; calY--; } if (calM > 12) { calM = 1; calY++; } calSel = ''; render(); return; }
  const cd = e.target.closest('[data-cd]'); if (cd) { calSel = (calSel === cd.dataset.cd) ? '' : cd.dataset.cd; render(); return; }
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const dy = e.target.closest('[data-day]'); if (dy) { const k = dy.dataset.day; if (openDays.has(k)) openDays.delete(k); else openDays.add(k); render(); return; }
  if (e.target.closest('[data-expall]')) { const ks = Array.from(document.querySelectorAll('.row.x')).map(x => x.dataset.day); if (ks.every(k => openDays.has(k))) ks.forEach(k => openDays.delete(k)); else ks.forEach(k => openDays.add(k)); render(); return; }
  const r = e.target.closest('[data-range]'); if (r) { ranges[tab] = r.dataset.range; render(); return; }
  if (e.target.closest('[data-copy]') && snap && snap.acct) {
    const done = () => toast('계좌번호를 복사했어요');
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(snap.acct).then(done, () => toast('길게 눌러서 복사해 주세요')); else toast('길게 눌러서 복사해 주세요');
  }
});
let db = null;
async function boot() {
  state = 'load'; render();
  if (!TOKEN || TOKEN.length < 16) { state = 'none'; render(); return; }
  try {
    if (!db) { firebase.initializeApp(cfg); db = firebase.firestore(); try { await firebase.auth().signInAnonymously(); } catch (e) { /* 규칙이 열려 있으면 인증 없이도 읽힘 */ } }
    await loadBrand();
    const d = await pubDocs().doc('ledger_' + TOKEN).get();
    if (!d.exists) { state = 'none'; render(); return; }
    const dd = d.data();
    if (dd.enc && dd.enc.c) { // 비밀번호로 암호화된 장부
      ENC = dd.enc; snap = null;
      let sv = ''; try { sv = localStorage.getItem('lg2_' + TOKEN) || ''; } catch (e) { sv = ''; }
      const o = /^\d{6}$/.test(sv) ? await decryptWith(sv) : null;
      if (o) { snap = o; PIN = sv; state = 'ok'; } else { try { localStorage.removeItem('lg2_' + TOKEN); } catch (e) { /* 무시 */ } state = 'pin2'; }
      render(); return;
    }
    snap = JSON.parse(dd.data || '{}');
    if (!snap || !Array.isArray(snap.ev)) { state = 'err'; render(); return; }
    let saved = null; try { saved = localStorage.getItem('lg_' + TOKEN); } catch (e) { saved = null; }
    state = (saved && saved === snap.pin) ? 'ok' : 'pin';
  } catch (e) { state = 'err'; }
  render();
}
boot();
