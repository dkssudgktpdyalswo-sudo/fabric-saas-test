<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보안 규칙 검사 (시험 서버 전용)</title>
<style>
  body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; max-width: 640px; margin: 30px auto; padding: 0 16px; color: #2b2b2b; }
  h1 { font-size: 19px; } .sub { color: #777; font-size: 13px; margin-bottom: 16px; }
  button { padding: 14px 20px; font-size: 16px; font-weight: 600; border: none; border-radius: 10px; background: #2b2b2b; color: #fff; width: 100%; }
  button:disabled { background: #aaa; }
  #out { margin-top: 16px; font-size: 13px; line-height: 1.7; }
  .ok { color: #1a7a4a; } .bad { color: #c0392b; font-weight: 700; } #sum { font-size: 16px; font-weight: 700; margin-top: 12px; }
</style>
</head>
<body>
<h1>보안 규칙 자동 검사</h1>
<div class="sub">fabric-saas-test(시험 서버)에서만 씁니다. 시험용 가게 2곳(rt-로 시작)과 시험 계정 3개를 만들고, "되어야 할 것은 되고, 막혀야 할 것은 막히는지" 확인합니다. 백야 데이터와는 아무 상관이 없습니다.<br><br><b>① 운영자(대표님) 구글로 로그인 → ② 검사 시작</b> 순서로 눌러 주세요. 새 가게는 운영자가 승인해야 쓸 수 있어서, 검사 중에 운영자 계정으로 시험 가게를 승인합니다.</div>
<button id="adm" onclick="adminLogin()" style="background:#fff;color:#2b2b2b;border:1px solid #ccc;margin-bottom:8px;">① 운영자 구글로 로그인</button>
<button id="go" onclick="runAll()">② 검사 시작</button>
<div id="out"></div><div id="sum"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const cfg = { apiKey: "AIzaSyCeWjdi2yBaBsiVSydDYHDAmQAT4hsGs6I", authDomain: "fabric-saas-test.firebaseapp.com", projectId: "fabric-saas-test", appId: "1:93481473112:web:5f88067e0e01dfba24e62d" };
if (cfg.projectId !== 'fabric-saas-test') throw new Error('시험 서버 전용');
const out = document.getElementById('out');
let pass = 0, fail = 0;
const log = (ok, t, extra) => { ok ? pass++ : fail++; out.innerHTML += `<div class="${ok ? 'ok' : 'bad'}">${ok ? '✔' : '✘'} ${t}${extra ? ' <small>(' + extra + ')</small>' : ''}</div>`; };
const rnd = Math.random().toString(36).slice(2, 7);
const SA = 'rt-a-' + rnd, SB = 'rt-b-' + rnd;
let n = 0;
async function user(label) { // 계정마다 따로 연결
  const app = firebase.initializeApp(cfg, label + (n++));
  const email = `${label}-${rnd}@rt.test-fabric`;
  const cred = await app.auth().createUserWithEmailAndPassword(email, 'rt-' + rnd + '-pw');
  return { app, db: app.firestore(), uid: cred.user.uid, email };
}
async function expectOk(t, fn) { try { await fn(); log(true, t); } catch (e) { log(false, t + ' → 되어야 하는데 막힘', e.code || e.message); } }
async function expectDenied(t, fn) { try { await fn(); log(false, t + ' → 막혀야 하는데 됨'); } catch (e) { log(e.code === 'permission-denied' || e.message === 'TAKEN', t, e.code || e.message); } }
async function createShop(u, id, name, opts) { // 앱의 createShop과 같은 방식
  const shopRef = u.db.collection('shops').doc(id);
  await u.db.runTransaction(async tx => {
    const s = await tx.get(shopRef); if (s.exists) throw new Error('TAKEN');
    const now = new Date().toISOString();
    const shopDoc = { name, ownerUid: u.uid, ownerEmail: u.email, plan: 'trial', status: 'pending', createdAt: now };
    if (opts && opts.status === null) delete shopDoc.status; else if (opts && opts.status) shopDoc.status = opts.status;
    tx.set(shopRef, shopDoc);
    tx.set(shopRef.collection('members').doc(u.uid), { role: 'owner', name, email: u.email, active: true, createdAt: now });
    tx.set(u.db.collection('users').doc(u.uid), { shopId: id });
  });
}
const D = (u, shop, col, id) => u.db.collection('shops').doc(shop).collection(col).doc(id);
let ADM = null; // 운영자 (대표님 구글 계정)
async function adminLogin() {
  try {
    const app = firebase.apps.find(a => a.name === 'admin') || firebase.initializeApp(cfg, 'admin');
    const cred = await app.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
    const isAdm = (await app.firestore().collection('admins').doc(cred.user.uid).get()).exists;
    ADM = isAdm ? { app, db: app.firestore(), uid: cred.user.uid } : null;
    document.getElementById('adm').textContent = isAdm ? `① 운영자 로그인됨 (${cred.user.email})` : `① ${cred.user.email}은 아직 운영자로 등록 안 됨 (admin.html 안내 참고)`;
  } catch (e) { document.getElementById('adm').textContent = '① 로그인 실패: ' + (e.code || e.message); }
}
const approve = (shop, st) => ADM.db.collection('shops').doc(shop).update({ status: st || 'active', statusAt: new Date().toISOString() });
async function runAll() {
  const btn = document.getElementById('go'); btn.disabled = true; out.innerHTML = ''; pass = fail = 0;
  try {
    const A = await user('owner-a'), B = await user('owner-b'), S = await user('staff-a'), C = await user('owner-c');
    out.innerHTML += `<div>시험 가게: ${SA}, ${SB}</div>`;
    if (!ADM) { log(false, '운영자 로그인이 안 돼서 승인 관련 검사를 할 수 없습니다 - ① 버튼부터 눌러 주세요'); throw new Error('운영자 없음'); }
    await expectOk('1. 대표A가 새 가게를 만든다 (승인 대기로)', () => createShop(A, SA, '시험가게A'));
    await expectOk('2. 대표B가 새 가게를 만든다 (승인 대기로)', () => createShop(B, SB, '시험가게B'));
    await expectDenied('2-1. 승인 대기 없이(바로 사용 중으로) 가게 만들기', () => createShop(C, 'rt-c-' + rnd, 'x', { status: 'active' }));
    await expectDenied('2-2. 상태 칸 없이 가게 만들기 (예전 방식으로 승인 피하기)', () => createShop(C, 'rt-c-' + rnd, 'x', { status: null }));
    await expectOk('2-2a. 같은 사람이 승인 대기로 만들면 됨 (위 두 개는 상태 때문에 막힌 것 확인)', () => createShop(C, 'rt-c-' + rnd, '시험가게C'));
    await expectOk('2-3. 승인 전에도 첫 설정(settings)은 만들 수 있음', () => D(A, SA, 'data', 'settings').set({ data: '{}', rev: 1, stamp: 2 }));
    await expectDenied('2-4. 승인 전 장부(재고) 저장', () => D(A, SA, 'data', 'rolls').set({ data: '[]', rev: 1, stamp: 2 }));
    await expectDenied('2-5. 승인 전 고객 페이지 올리기', () => D(A, SA, 'public', 'pubIndex').set({ data: '{}' }));
    await expectDenied('2-6. 대표A가 스스로 승인하기', () => A.db.collection('shops').doc(SA).update({ status: 'active' }));
    await expectDenied('2-7. 대표B가 다른 가게 목록 보기', () => B.db.collection('shops').get());
    await expectOk('2-8. 운영자가 모든 가게 목록 보기', () => ADM.db.collection('shops').get());
    await expectDenied('2-9. 운영자도 상태 말고 다른 칸(대표)은 못 바꿈', () => ADM.db.collection('shops').doc(SA).update({ ownerUid: 'x' }));
    await expectOk('2-10. 운영자가 A·B 가게 승인', async () => { await approve(SA); await approve(SB); });
    await expectDenied('3. 대표B가 이미 있는 가게 코드(A)로 또 만들기', () => createShop(B, SA, '가로채기'));
    await expectDenied('4. 대표B가 A 가게에 자기를 대표으로 끼워넣기', () => D(B, SA, 'members', B.uid).set({ role: 'owner', active: true, name: 'x' }));
    await expectDenied('5. 대표B가 A 가게에 자기를 직원으로 끼워넣기', () => D(B, SA, 'members', B.uid).set({ role: 'staff', active: true, name: 'x' }));
    await expectDenied('6. 잘못된 가게 코드(대문자·밑줄) 만들기', () => createShop(B, 'Bad_ID' + rnd, 'x'));
    await expectOk('7. 대표A가 자기 장부 저장 (stamp 2)', () => D(A, SA, 'data', 'rolls').set({ data: '[]', rev: 1, stamp: 2 }));
    await expectDenied('8. 대표A가 stamp 없는 저장 (예전 버전 코드 차단)', () => D(A, SA, 'data', 'rolls').set({ data: '[]', rev: 2 }));
    await expectOk('9. 대표A가 자기 장부 읽기', () => D(A, SA, 'data', 'rolls').get());
    await expectDenied('10. 대표B가 A 가게 장부 읽기', () => D(B, SA, 'data', 'rolls').get());
    await expectDenied('11. 대표B가 A 가게 장부 덮어쓰기', () => D(B, SA, 'data', 'rolls').set({ data: '[]', rev: 9, stamp: 2 }));
    await expectDenied('12. 대표B가 A 가게 백업 읽기', () => D(B, SA, 'backups', 'x').get());
    await expectDenied('13. 대표A가 매출장부 문서 통째 삭제', () => D(A, SA, 'data', 'shipmentLog').delete());
    // 직원 등록 (앱의 staffAdd와 같은 방식)
    await expectOk('14. 대표A가 직원S를 등록', async () => { const b = A.db.batch(); b.set(D(A, SA, 'members', S.uid), { role: 'staff', name: '시험직원', loginId: 's', active: true }); b.set(A.db.collection('users').doc(S.uid), { shopId: SA }); await b.commit(); });
    await expectOk('15. 직원S가 A 가게 장부 읽기', () => D(S, SA, 'data', 'rolls').get());
    await expectOk('16. 직원S가 A 가게 장부 저장', () => D(S, SA, 'data', 'rolls').set({ data: '[]', rev: 3, stamp: 2 }));
    // 변경 기록: 추가만, 남 이름·역할 속이기 막힘, 보는 건 대표만, 고치기·지우기 아무도 못 함
    const LG = (u, shop) => u.db.collection('shops').doc(shop).collection('logs');
    const ST = () => firebase.firestore.FieldValue.serverTimestamp();
    let logId = null;
    await expectOk('16-1. 직원S가 변경 기록 남기기', async () => { const r = await LG(S, SA).add({ at: ST(), by: S.uid, name: '시험직원', role: 'staff', lines: [{ d: 'rolls', t: '입고 · 시험' }], n: 1, v: 1 }); logId = r.id; });
    await expectDenied('16-2. 직원S가 대표 계정번호로 기록 남기기', () => LG(S, SA).add({ at: ST(), by: A.uid, name: '대표', role: 'staff', lines: [], n: 0, v: 1 }));
    await expectDenied('16-3. 직원S가 역할을 대표으로 속여 기록', () => LG(S, SA).add({ at: ST(), by: S.uid, name: '시험직원', role: 'owner', lines: [], n: 0, v: 1 }));
    await expectDenied('16-4. 직원S가 변경 기록 보기', () => LG(S, SA).get());
    await expectOk('16-5. 대표A가 변경 기록 보기', () => LG(A, SA).get());
    await expectDenied('16-6. 대표A가 기록 고치기', () => LG(A, SA).doc(logId || 'x').update({ name: '바꿈' }));
    await expectDenied('16-7. 대표A가 기록 지우기', () => LG(A, SA).doc(logId || 'x').delete());
    await expectDenied('16-8. 대표B가 A 가게에 기록 남기기', () => LG(B, SA).add({ at: ST(), by: B.uid, name: 'x', role: 'owner', lines: [], n: 0, v: 1 }));
    await expectDenied('16-9. 운영자도 기록 지우기 못 함', () => ADM.db.collection('shops').doc(SA).collection('logs').doc(logId || 'x').delete());
    // 창고 출고: 가게 사람은 자기 이름으로 보냄(sent)만, 끝·지움 표시만, 다른 가게는 못 봄
    const WQ = (u) => u.db.collection('shops').doc(SA).collection('whq');
    const wq = (x) => Object.assign({ at: ST(), by: S.uid, name: '시험직원', orderId: null, customer: '', item: 'A-201', color: '검정', unit: 'y', cuts: [52, 48], status: 'sent', v: 1 }, x || {});
    let wqId = null;
    await expectOk('16-10. 직원S가 창고 출고 보내기', async () => { const r = await WQ(S).add(wq()); wqId = r.id; });
    await expectDenied('16-11. 직원S가 대표 이름으로 창고 출고 보내기', () => WQ(S).add(wq({ by: A.uid })));
    await expectDenied('16-12. 처리 끝(done)으로 꾸며서 보내기', () => WQ(S).add(wq({ status: 'done' })));
    await expectDenied('16-13. 정해진 칸 말고 다른 칸(단가) 끼워 넣기', () => WQ(S).add(wq({ price: 3000 })));
    await expectDenied('16-14. 대표B가 A 가게 창고 출고 보기', () => WQ(B).get());
    await expectOk('16-15. 대표A가 창고 출고 보기', () => WQ(A).get());
    await expectDenied('16-16. 대표A가 야드(cuts) 바꾸기', () => WQ(A).doc(wqId || 'x').update({ cuts: [1], status: 'done', doneBy: A.uid }));
    await expectOk('16-17. 대표A가 끝 표시', () => WQ(A).doc(wqId || 'x').update({ status: 'done', doneAt: ST(), doneBy: A.uid, doneName: '대표' }));
    await expectDenied('16-18. 끝난 건 다시 고치기', () => WQ(S).doc(wqId || 'x').update({ status: 'void', doneAt: ST(), doneBy: S.uid, doneName: 'x' }));
    await expectDenied('16-19. 직원S가 창고 출고 지우기', () => WQ(S).doc(wqId || 'x').delete());
    await expectOk('16-20. 직원S가 절째·샘플·메모 넣어 보내기', () => WQ(S).add(wq({ whole: [true, false], sample: true, memo: '끝단 얼룩' })));
    await expectDenied('16-21. 메모 60자 넘게', () => WQ(S).add(wq({ memo: 'ㄱ'.repeat(61) })));
    await expectOk('16-22. 절·탕·실마수 고침까지 넣어 보내기', () => WQ(S).add(wq({ cuts: [23, 27], whole: [false, false], rolls: [11, 12], tangs: [1, 2], from: [60, 55], fixes: [{ r: 12, t: 2, s: 55, a: 54.5 }], v: 2 })));
    await expectOk('16-23. 실마수 고치기만 보내기 (야드 없이)', () => WQ(S).add(wq({ cuts: [], fixes: [{ r: 12, t: 2, s: 55, a: 54 }], v: 2 })));
    await expectDenied('16-24. 야드도 실마수도 없이 보내기', () => WQ(S).add(wq({ cuts: [] })));
    await expectOk('16-25. 직원S가 반품 받아옴 보내기', () => WQ(S).add(wq({ kind: 'ret', retType: 'return', customer: '시험거래처', cuts: [30, 25], v: 2 })));
    await expectDenied('16-26. 반품 종류에 이상한 값', () => WQ(S).add(wq({ kind: 'ret', retType: 'free', cuts: [30], v: 2 })));
    await expectOk('16-27. 야드 없이 노트 사진만 보내기', () => WQ(S).add(wq({ cuts: [], photo: 'data:image/jpeg;base64,' + 'A'.repeat(2000), v: 2 })));
    await expectDenied('16-28. 사진 칸에 사진 아닌 글', () => WQ(S).add(wq({ cuts: [], photo: '<script>', v: 2 })));
    await expectDenied('17. 직원S가 직원 목록 보기', () => S.db.collection('shops').doc(SA).collection('members').get());
    await expectDenied('18. 직원S가 자기를 대표으로 바꾸기', () => D(S, SA, 'members', S.uid).update({ role: 'owner' }));
    await expectDenied('19. 직원S가 백업 삭제', () => D(S, SA, 'backups', 'x').delete());
    await expectDenied('20. 직원S가 다른 계정을 자기 가게에 연결', () => S.db.collection('users').doc(B.uid).set({ shopId: SA }));
    await expectDenied('21. 대표A가 자기 역할 바꾸기', () => D(A, SA, 'members', A.uid).update({ role: 'staff' }));
    await expectOk('22. 가게 이름표(장부 링크용)는 로그인 없이 읽힘', async () => { await D(A, SA, 'public', 'brand').set({ name: '시험' }); const p = firebase.initializeApp(cfg, 'anon' + rnd); await p.firestore().collection('shops').doc(SA).collection('public').doc('brand').get(); });
    await expectDenied('23. 로그인 안 한 사람이 장부 읽기', () => firebase.app('anon' + rnd).firestore().collection('shops').doc(SA).collection('data').doc('rolls').get());
    await expectOk('24. 대표A가 직원S 사용 중지', () => D(A, SA, 'members', S.uid).update({ active: false }));
    await expectDenied('25. 사용 중지된 직원S가 장부 읽기', () => D(S, SA, 'data', 'rolls').get());
    await expectOk('26. 운영자가 A 가게 사용 중지', () => approve(SA, 'suspended'));
    await expectDenied('27. 사용 중지된 가게 대표A가 장부 저장', () => D(A, SA, 'data', 'rolls').set({ data: '[]', rev: 5, stamp: 2 }));
    await expectOk('28. 사용 중지돼도 장부 읽기는 됨 (내용 보관)', () => D(A, SA, 'data', 'rolls').get());
    await expectOk('29. 운영자가 A 가게 다시 사용', () => approve(SA, 'active'));
    await expectOk('30. 다시 사용 후 대표A 저장 됨', () => D(A, SA, 'data', 'rolls').set({ data: '[]', rev: 6, stamp: 2 }));
    // 프리미엄(홍보·고객 페이지): 운영자만 켬, 안 켠 가게는 고객 페이지를 올리지도 보이지도 않음, 장부 링크는 모든 가게
    const anonPub = (id) => firebase.app('anon' + rnd).firestore().collection('shops').doc(SA).collection('public').doc(id).get();
    await expectDenied('31. 대표A가 스스로 프리미엄 켜기', () => A.db.collection('shops').doc(SA).update({ plan: 'premium' }));
    await expectDenied('32. 프리미엄 아닌 가게가 고객 페이지 올리기', () => D(A, SA, 'public', 'pubIndex').set({ data: '{}' }));
    await expectOk('33. 프리미엄 아니어도 장부 링크 올리기', () => D(A, SA, 'public', 'ledger_rt' + rnd).set({ data: '{}' }));
    await expectOk('34. 장부 링크는 로그인 없이 열림', () => anonPub('ledger_rt' + rnd));
    await expectDenied('34-1. 로그인 없이 공개 공간 목록 조회 (장부 링크 주소 모으기)', () => firebase.app('anon' + rnd).firestore().collection('shops').doc(SA).collection('public').get());
    await expectDenied('34-2. 다른 가게 대표가 공개 공간 목록 조회', () => B.db.collection('shops').doc(SA).collection('public').get());
    await expectDenied('35. 운영자도 이상한 구독값은 못 넣음', () => ADM.db.collection('shops').doc(SA).update({ plan: 'gold' }));
    await expectOk('36. 운영자가 A 가게 프리미엄 켜기', () => ADM.db.collection('shops').doc(SA).update({ plan: 'premium', planAt: new Date().toISOString() }));
    await expectOk('37. 프리미엄 가게는 고객 페이지 올리기 됨', () => D(A, SA, 'public', 'pubIndex').set({ data: '{}' }));
    await expectOk('38. 고객 페이지는 로그인 없이 열림', () => anonPub('pubIndex'));
    await expectOk('39. 운영자가 프리미엄 끄기', () => ADM.db.collection('shops').doc(SA).update({ plan: 'basic', planAt: new Date().toISOString() }));
    await expectDenied('40. 프리미엄 끄면 고객 페이지 바로 닫힘', () => anonPub('pubIndex'));
    // 손님 요청함: 로그인 없이 "추가"만, 정해진 칸·길이만, 보기·처리는 대표·매니저
    const RQ = (db) => db.collection('shops').doc(SA).collection('requests');
    const anonDb = () => firebase.app('anon' + rnd).firestore();
    const req = (x) => Object.assign({ at: ST(), kind: 'sample', item: 'A-201', cols: '3 블루그레이', qty: 2, name: '시험봉제', tel: '010-1234-5678', memo: '', done: false, v: 1 }, x || {});
    let reqId = null;
    await expectDenied('41. 프리미엄 아닌 가게에 손님 요청 남기기', () => RQ(anonDb()).add(req()));
    await expectOk('42. 운영자가 A 가게 프리미엄 다시 켜기', () => ADM.db.collection('shops').doc(SA).update({ plan: 'premium', planAt: new Date().toISOString() }));
    await expectOk('43. 손님이 로그인 없이 샘플감 요청 남기기', async () => { const r = await RQ(anonDb()).add(req()); reqId = r.id; });
    await expectDenied('44. 정해진 칸 말고 다른 칸(단가) 끼워 넣기', () => RQ(anonDb()).add(req({ price: 1 })));
    await expectDenied('45. 상호 없이 요청', () => RQ(anonDb()).add(req({ name: '' })));
    await expectDenied('46. 너무 긴 메모 (201자)', () => RQ(anonDb()).add(req({ memo: 'x'.repeat(201) })));
    await expectDenied('46-1. 너무 긴 연락처 (21자)', () => RQ(anonDb()).add(req({ tel: '0'.repeat(21) })));
    await expectDenied('47. 처리 완료로 꾸며서 남기기', () => RQ(anonDb()).add(req({ done: true })));
    await expectDenied('48. 이상한 종류(kind)', () => RQ(anonDb()).add(req({ kind: 'order' })));
    await expectDenied('49. 손님이 요청 목록 보기', () => RQ(anonDb()).get());
    await expectDenied('50. 대표B가 A 가게 요청 보기', () => RQ(B.db).get());
    await expectOk('51. 대표A가 요청 보기', () => RQ(A.db).get());
    await expectOk('52. 대표A가 처리 완료 표시', () => RQ(A.db).doc(reqId || 'x').update({ done: true, doneAt: new Date().toISOString(), doneBy: '대표' }));
    await expectDenied('53. 대표A도 손님이 쓴 내용은 못 바꿈', () => RQ(A.db).doc(reqId || 'x').update({ name: '바꿈' }));
    await expectDenied('54. 손님이 요청 지우기', () => RQ(anonDb()).doc(reqId || 'x').delete());
    await expectOk('55. 대표A가 직원S 다시 사용', () => D(A, SA, 'members', S.uid).update({ active: true }));
    await expectDenied('56. 직원S는 요청 못 봄 (홍보는 매니저 이상)', () => RQ(S.db).get());
    await expectOk('57. 대표A가 요청 지우기', () => RQ(A.db).doc(reqId || 'x').delete());
    // 거래처 링크로 온 손님: 상호 없이도 요청 가능 (링크 글자 8자 이상일 때만)
    await expectOk('58. 링크로 온 손님은 상호 없이 요청', () => RQ(anonDb()).add(req({ name: '', to: 'k7x2qm9a' })));
    await expectDenied('59. 링크 글자가 짧으면 상호 필수', () => RQ(anonDb()).add(req({ name: '', to: 'abc' })));
    // 본 기록: 손님은 추가만
    const VW = (db) => db.collection('shops').doc(SA).collection('views');
    let viewId = null;
    await expectOk('60. 손님 페이지 열림 기록 남기기', async () => { const r = await VW(anonDb()).add({ at: ST(), p: 'stock', i: 'A-201', to: 'k7x2qm9a', v: 1 }); viewId = r.id; });
    await expectDenied('61. 열림 기록에 다른 칸(이름) 끼워 넣기', () => VW(anonDb()).add({ at: ST(), p: 'new', name: '누구', v: 1 }));
    await expectDenied('62. 이상한 화면 이름', () => VW(anonDb()).add({ at: ST(), p: 'admin', v: 1 }));
    await expectDenied('63. 시각을 꾸며서 남기기', () => VW(anonDb()).add({ at: new Date(2020, 0, 1), p: 'new', v: 1 }));
    await expectDenied('64. 손님이 열림 기록 보기', () => VW(anonDb()).get());
    await expectDenied('65. 대표B가 A 가게 열림 기록 보기', () => VW(B.db).get());
    await expectOk('66. 대표A가 열림 기록 보기', () => VW(A.db).get());
    await expectDenied('67. 대표A도 열림 기록은 못 고침', () => VW(A.db).doc(viewId || 'x').update({ p: 'new' }));
    await expectDenied('68. 직원S는 열림 기록 못 봄', () => VW(S.db).get());
    // 보낸 기록: 대표·매니저만
    const SN = (db) => db.collection('shops').doc(SA).collection('sends');
    const snd = (u, x) => Object.assign({ at: ST(), by: u.uid, name: '대표', c: '한빛봉제', to: 'k7x2qm9a', what: 'new', items: ['A-201'], v: 1 }, x || {});
    await expectOk('69. 대표A가 보낸 기록 남기기', () => SN(A.db).add(snd(A)));
    await expectDenied('70. 남의 이름(by)으로 남기기', () => SN(A.db).add(snd(A, { by: B.uid })));
    await expectDenied('71. 직원S는 보낸 기록 못 남김', () => SN(S.db).add(snd(S)));
    await expectDenied('72. 손님은 보낸 기록 못 남김', () => SN(anonDb()).add(snd({ uid: 'x' })));
    await expectDenied('73. 대표B가 A 가게 보낸 기록 보기', () => SN(B.db).get());
    await expectOk('74. 대표A가 보낸 기록 보기', () => SN(A.db).get());
    // 시그니처 디자인: 운영자만 켬
    await expectDenied('75. 대표A가 자기 가게 시그니처 켜기', () => A.db.collection('shops').doc(SA).update({ sigDesign: true }));
    await expectOk('76. 운영자가 A 가게 시그니처 켜기', () => ADM.db.collection('shops').doc(SA).update({ sigDesign: true, sigAt: new Date().toISOString() }));
    await expectDenied('77. 시그니처 값에 이상한 값', () => ADM.db.collection('shops').doc(SA).update({ sigDesign: 'yes' }));
    // 프리미엄 끈 뒤 14일 유예: 손님 링크가 갑자기 안 깨짐
    const TS = (ms) => firebase.firestore.Timestamp.fromMillis(ms);
    await expectOk('78. 운영자가 프리미엄 끄기 (14일 유예)', () => ADM.db.collection('shops').doc(SA).update({ plan: 'basic', planAt: new Date().toISOString(), premiumUntil: TS(Date.now() + 14 * 864e5) }));
    await expectOk('79. 유예 중엔 손님이 고객 페이지 그대로 봄', () => anonPub('pubIndex'));
    await expectOk('80. 유예 중 손님 재입고 알림 요청', () => RQ(anonDb()).add(req({ kind: 'restock', qty: 0 })));
    await expectDenied('81. 유예를 30일로 늘리기', () => ADM.db.collection('shops').doc(SA).update({ premiumUntil: TS(Date.now() + 30 * 864e5) }));
    await expectDenied('82. 대표A가 자기 가게 유예 늘리기', () => A.db.collection('shops').doc(SA).update({ premiumUntil: TS(Date.now() + 10 * 864e5) }));
    await expectOk('83. 유예가 끝난 가게로 바꾸기 (어제)', () => ADM.db.collection('shops').doc(SA).update({ premiumUntil: TS(Date.now() - 864e5) }));
    await expectDenied('84. 유예 끝나면 고객 페이지 닫힘', () => anonPub('pubIndex'));
    await expectOk('85. 운영자가 다시 프리미엄 켜기 (유예 지움)', () => ADM.db.collection('shops').doc(SA).update({ plan: 'premium', planAt: new Date().toISOString(), premiumUntil: firebase.firestore.FieldValue.delete() }));
    // [데이터 보호] 운영자는 평소 장부를 못 읽음. 대표가 「지원 접근」을 켜고 + 운영자가 그 시간 접근 기록을 남겨야만 읽기(쓰기는 불가)
    const SH = (u) => u.db.collection('shops').doc(SA);
    const AL = (u) => SH(u).collection('accessLog');
    const hourNo = () => Math.floor(Date.now() / 3600000);
    const supportLog = async () => { let okN = 0; for (const h of [hourNo() - 1, hourNo(), hourNo() + 1]) { try { await AL(ADM).doc(ADM.uid + '_' + h).set({ at: ST(), by: ADM.uid, kind: 'support', what: '시험' }); okN++; } catch (e) { /* 서버 시각과 다른 시간 번호는 막힘 */ } } if (okN !== 1) throw new Error('기록 ' + okN + '개'); };
    await expectDenied('86. 운영자가 평소 A 가게 장부 읽기', () => D(ADM, SA, 'data', 'rolls').get());
    await expectDenied('87. 운영자가 평소 A 가게 변경 기록 보기', () => ADM.db.collection('shops').doc(SA).collection('logs').get());
    await expectDenied('88. 운영자가 평소 A 가게 손님 요청 보기', () => ADM.db.collection('shops').doc(SA).collection('requests').get());
    await expectDenied('89. 운영자가 A 가게 직원 명단 보기', () => ADM.db.collection('shops').doc(SA).collection('members').get());
    await expectOk('89-1. 운영자는 가입 승인용 대표 계정 문서만 봄', () => D(ADM, SA, 'members', A.uid).get());
    await expectDenied('90. 운영자가 스스로 지원 접근 켜기', () => SH(ADM).update({ supportUntil: TS(Date.now() + 864e5) }));
    await expectDenied('91. 대표B가 A 가게 지원 접근 켜기', () => SH(B).update({ supportUntil: TS(Date.now() + 864e5) }));
    await expectDenied('92. 대표A가 지원 접근 4일 (최대 3일)', () => SH(A).update({ supportUntil: TS(Date.now() + 4 * 864e5), supportAt: ST() }));
    await expectDenied('92-1. 지원 접근 꺼져 있을 때 운영자 기록 남기기', () => AL(ADM).doc(ADM.uid + '_' + hourNo()).set({ at: ST(), by: ADM.uid, kind: 'support', what: '' }));
    await expectOk('93. 대표A가 지원 접근 24시간 켜기 + 기록', async () => { await SH(A).update({ supportUntil: TS(Date.now() + 864e5), supportAt: ST() }); await AL(A).add({ at: ST(), by: A.uid, kind: 'allow', what: '24시간', until: TS(Date.now() + 864e5) }); });
    await expectDenied('94. 지원 중이어도 기록 없이 장부 읽기', () => D(ADM, SA, 'data', 'rolls').get());
    await expectDenied('95. 운영자가 다른 시간 번호(미래)로 기록 남기기', () => AL(ADM).doc(ADM.uid + '_' + (hourNo() + 5)).set({ at: ST(), by: ADM.uid, kind: 'support', what: '' }));
    await expectDenied('95-1. 운영자가 시간 기록을 "view" 종류로 위장', () => AL(ADM).doc(ADM.uid + '_' + (hourNo() + 5)).set({ at: ST(), by: ADM.uid, kind: 'view', what: '' }));
    await expectOk('96. 운영자가 지금 시간 접근 기록 남기기 (서버 시각 기준 1개만 됨)', supportLog);
    await expectOk('97. 기록을 남긴 뒤 운영자가 장부 읽기', () => D(ADM, SA, 'data', 'rolls').get());
    await expectOk('97-1. 운영자가 화면 열람 기록 추가', () => AL(ADM).add({ at: ST(), by: ADM.uid, kind: 'view', what: '재고' }));
    await expectDenied('98. 지원 중에도 운영자가 장부 쓰기', () => D(ADM, SA, 'data', 'rolls').set({ data: '[]', rev: 99, stamp: 2 }));
    await expectDenied('99. 운영자가 접근 기록 지우기', () => AL(ADM).doc(ADM.uid + '_' + hourNo()).delete());
    await expectDenied('99-1. 운영자가 접근 기록 고치기', () => AL(ADM).doc(ADM.uid + '_' + hourNo()).update({ what: '바꿈' }));
    await expectDenied('100. 운영자가 접근 기록 보기', () => AL(ADM).get());
    await expectOk('100-1. 대표A가 접근 기록 보기', () => AL(A).get());
    await expectDenied('100-2. 대표A도 접근 기록 지우기 못 함', () => AL(A).doc(ADM.uid + '_' + hourNo()).delete());
    await expectDenied('100-3. 대표B가 A 가게 접근 기록 남기기', () => AL(B).add({ at: ST(), by: B.uid, kind: 'allow', what: '' }));
    await expectOk('101. 대표A가 지원 접근 끄기', () => SH(A).update({ supportUntil: null, supportAt: ST() }));
    await expectDenied('101-1. 끈 뒤 운영자가 장부 읽기 (기록이 있어도)', () => D(ADM, SA, 'data', 'rolls').get());
    await expectDenied('102. 탈퇴 신청: 30일보다 짧게', () => SH(A).update({ closeAt: TS(Date.now() + 5 * 864e5), closeReqAt: ST() }));
    await expectOk('102-1. 대표A 탈퇴 신청 (30일 뒤 삭제)', () => SH(A).update({ closeAt: TS(Date.now() + 30 * 864e5 + 60000), closeReqAt: ST() }));
    await expectDenied('102-2. 운영자가 탈퇴 날짜 바꾸기', () => SH(ADM).update({ closeAt: TS(Date.now() + 31 * 864e5) }));
    await expectOk('102-3. 대표A 탈퇴 취소', () => SH(A).update({ closeAt: null, closeReqAt: ST() }));
  } catch (e) { log(false, '검사 준비 실패', e.code || e.message); }
  document.getElementById('sum').innerHTML = fail === 0 ? `<span class="ok">전부 통과 (${pass}개)</span>` : `<span class="bad">실패 ${fail}개 / 통과 ${pass}개</span>`;
}
</script>
</body>
