<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보안 규칙 검사 (시험 서버 전용)</title>
<style>
  body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; max-width: 640px; margin: 30px auto; padding: 0 16px; color: #2b2b2b; }
  h1 { font-size: 19px; } .sub { color: #777; font-size: 13px; margin-bottom: 16px; }
  button { padding: 14px 20px; font-size: 16px; font-weight: 600; border: none; border-radius: 10px; background: #2b2b2b; color: #fff; width: 100%; }
  button:disabled { background: #aaa; }
  #out { margin-top: 16px; font-size: 13px; line-height: 1.7; }
  .ok { color: #1a7a4a; } .bad { color: #c0392b; font-weight: 700; } #sum { font-size: 16px; font-weight: 700; margin-top: 12px; }
</style>
</head>
<body>
<h1>보안 규칙 자동 검사</h1>
<div class="sub">fabric-saas-test(시험 서버)에서만 씁니다. 시험용 가게 2곳(rt-로 시작)과 시험 계정 3개를 만들고, "되어야 할 것은 되고, 막혀야 할 것은 막히는지" 확인합니다. 백야 데이터와는 아무 상관이 없습니다.<br><br><b>① 운영자(사장님) 구글로 로그인 → ② 검사 시작</b> 순서로 눌러 주세요. 새 가게는 운영자가 승인해야 쓸 수 있어서, 검사 중에 운영자 계정으로 시험 가게를 승인합니다.</div>
<button id="adm" onclick="adminLogin()" style="background:#fff;color:#2b2b2b;border:1px solid #ccc;margin-bottom:8px;">① 운영자 구글로 로그인</button>
<button id="go" onclick="runAll()">② 검사 시작</button>
<div id="out"></div><div id="sum"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const cfg = { apiKey: "AIzaSyCeWjdi2yBaBsiVSydDYHDAmQAT4hsGs6I", authDomain: "fabric-saas-test.firebaseapp.com", projectId: "fabric-saas-test", appId: "1:93481473112:web:5f88067e0e01dfba24e62d" };
if (cfg.projectId !== 'fabric-saas-test') throw new Error('시험 서버 전용');
const out = document.getElementById('out');
let pass = 0, fail = 0;
const log = (ok, t, extra) => { ok ? pass++ : fail++; out.innerHTML += `<div class="${ok ? 'ok' : 'bad'}">${ok ? '✔' : '✘'} ${t}${extra ? ' <small>(' + extra + ')</small>' : ''}</div>`; };
const rnd = Math.random().toString(36).slice(2, 7);
const SA = 'rt-a-' + rnd, SB = 'rt-b-' + rnd;
let n = 0;
async function user(label) { // 계정마다 따로 연결
  const app = firebase.initializeApp(cfg, label + (n++));
  const email = `${label}-${rnd}@rt.test-fabric`;
  const cred = await app.auth().createUserWithEmailAndPassword(email, 'rt-' + rnd + '-pw');
  return { app, db: app.firestore(), uid: cred.user.uid, email };
}
async function expectOk(t, fn) { try { await fn(); log(true, t); } catch (e) { log(false, t + ' → 되어야 하는데 막힘', e.code || e.message); } }
async function expectDenied(t, fn) { try { await fn(); log(false, t + ' → 막혀야 하는데 됨'); } catch (e) { log(e.code === 'permission-denied' || e.message === 'TAKEN', t, e.code || e.message); } }
async function createShop(u, id, name, opts) { // 앱의 createShop과 같은 방식
  const shopRef = u.db.collection('shops').doc(id);
  await u.db.runTransaction(async tx => {
    const s = await tx.get(shopRef); if (s.exists) throw new Error('TAKEN');
    const now = new Date().toISOString();
    const shopDoc = { name, ownerUid: u.uid, ownerEmail: u.email, plan: 'trial', status: 'pending', createdAt: now };
    if (opts && opts.status === null) delete shopDoc.status; else if (opts && opts.status) shopDoc.status = opts.status;
    tx.set(shopRef, shopDoc);
    tx.set(shopRef.collection('members').doc(u.uid), { role: 'owner', name, email: u.email, active: true, createdAt: now });
    tx.set(u.db.collection('users').doc(u.uid), { shopId: id });
  });
}
const D = (u, shop, col, id) => u.db.collection('shops').doc(shop).collection(col).doc(id);
let ADM = null; // 운영자 (사장님 구글 계정)
async function adminLogin() {
  try {
    const app = firebase.apps.find(a => a.name === 'admin') || firebase.initializeApp(cfg, 'admin');
    const cred = await app.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
    const isAdm = (await app.firestore().collection('admins').doc(cred.user.uid).get()).exists;
    ADM = isAdm ? { app, db: app.firestore(), uid: cred.user.uid } : null;
    document.getElementById('adm').textContent = isAdm ? `① 운영자 로그인됨 (${cred.user.email})` : `① ${cred.user.email}은 아직 운영자로 등록 안 됨 (admin.html 안내 참고)`;
  } catch (e) { document.getElementById('adm').textContent = '① 로그인 실패: ' + (e.code || e.message); }
}
const approve = (shop, st) => ADM.db.collection('shops').doc(shop).update({ status: st || 'active', statusAt: new Date().toISOString() });
async function runAll() {
  const btn = document.getElementById('go'); btn.disabled = true; out.innerHTML = ''; pass = fail = 0;
  try {
    const A = await user('owner-a'), B = await user('owner-b'), S = await user('staff-a'), C = await user('owner-c');
    out.innerHTML += `<div>시험 가게: ${SA}, ${SB}</div>`;
    if (!ADM) { log(false, '운영자 로그인이 안 돼서 승인 관련 검사를 할 수 없습니다 - ① 버튼부터 눌러 주세요'); throw new Error('운영자 없음'); }
    await expectOk('1. 사장A가 새 가게를 만든다 (승인 대기로)', () => createShop(A, SA, '시험가게A'));
    await expectOk('2. 사장B가 새 가게를 만든다 (승인 대기로)', () => createShop(B, SB, '시험가게B'));
    await expectDenied('2-1. 승인 대기 없이(바로 사용 중으로) 가게 만들기', () => createShop(C, 'rt-c-' + rnd, 'x', { status: 'active' }));
    await expectDenied('2-2. 상태 칸 없이 가게 만들기 (예전 방식으로 승인 피하기)', () => createShop(C, 'rt-c-' + rnd, 'x', { status: null }));
    await expectOk('2-2a. 같은 사람이 승인 대기로 만들면 됨 (위 두 개는 상태 때문에 막힌 것 확인)', () => createShop(C, 'rt-c-' + rnd, '시험가게C'));
    await expectOk('2-3. 승인 전에도 첫 설정(settings)은 만들 수 있음', () => D(A, SA, 'data', 'settings').set({ data: '{}', rev: 1, stamp: 2 }));
    await expectDenied('2-4. 승인 전 장부(재고) 저장', () => D(A, SA, 'data', 'rolls').set({ data: '[]', rev: 1, stamp: 2 }));
    await expectDenied('2-5. 승인 전 고객 페이지 올리기', () => D(A, SA, 'public', 'pubIndex').set({ data: '{}' }));
    await expectDenied('2-6. 사장A가 스스로 승인하기', () => A.db.collection('shops').doc(SA).update({ status: 'active' }));
    await expectDenied('2-7. 사장B가 다른 가게 목록 보기', () => B.db.collection('shops').get());
    await expectOk('2-8. 운영자가 모든 가게 목록 보기', () => ADM.db.collection('shops').get());
    await expectDenied('2-9. 운영자도 상태 말고 다른 칸(사장)은 못 바꿈', () => ADM.db.collection('shops').doc(SA).update({ ownerUid: 'x' }));
    await expectOk('2-10. 운영자가 A·B 가게 승인', async () => { await approve(SA); await approve(SB); });
    await expectDenied('3. 사장B가 이미 있는 가게 코드(A)로 또 만들기', () => createShop(B, SA, '가로채기'));
    await expectDenied('4. 사장B가 A 가게에 자기를 사장으로 끼워넣기', () => D(B, SA, 'members', B.uid).set({ role: 'owner', active: true, name: 'x' }));
    await expectDenied('5. 사장B가 A 가게에 자기를 직원으로 끼워넣기', () => D(B, SA, 'members', B.uid).set({ role: 'staff', active: true, name: 'x' }));
    await expectDenied('6. 잘못된 가게 코드(대문자·밑줄) 만들기', () => createShop(B, 'Bad_ID' + rnd, 'x'));
    await expectOk('7. 사장A가 자기 장부 저장 (stamp 2)', () => D(A, SA, 'data', 'rolls').set({ data: '[]', rev: 1, stamp: 2 }));
    await expectDenied('8. 사장A가 stamp 없는 저장 (예전 버전 코드 차단)', () => D(A, SA, 'data', 'rolls').set({ data: '[]', rev: 2 }));
    await expectOk('9. 사장A가 자기 장부 읽기', () => D(A, SA, 'data', 'rolls').get());
    await expectDenied('10. 사장B가 A 가게 장부 읽기', () => D(B, SA, 'data', 'rolls').get());
    await expectDenied('11. 사장B가 A 가게 장부 덮어쓰기', () => D(B, SA, 'data', 'rolls').set({ data: '[]', rev: 9, stamp: 2 }));
    await expectDenied('12. 사장B가 A 가게 백업 읽기', () => D(B, SA, 'backups', 'x').get());
    await expectDenied('13. 사장A가 매출장부 문서 통째 삭제', () => D(A, SA, 'data', 'shipmentLog').delete());
    // 직원 등록 (앱의 staffAdd와 같은 방식)
    await expectOk('14. 사장A가 직원S를 등록', async () => { const b = A.db.batch(); b.set(D(A, SA, 'members', S.uid), { role: 'staff', name: '시험직원', loginId: 's', active: true }); b.set(A.db.collection('users').doc(S.uid), { shopId: SA }); await b.commit(); });
    await expectOk('15. 직원S가 A 가게 장부 읽기', () => D(S, SA, 'data', 'rolls').get());
    await expectOk('16. 직원S가 A 가게 장부 저장', () => D(S, SA, 'data', 'rolls').set({ data: '[]', rev: 3, stamp: 2 }));
    // 변경 기록: 추가만, 남 이름·역할 속이기 막힘, 보는 건 사장만, 고치기·지우기 아무도 못 함
    const LG = (u, shop) => u.db.collection('shops').doc(shop).collection('logs');
    const ST = () => firebase.firestore.FieldValue.serverTimestamp();
    let logId = null;
    await expectOk('16-1. 직원S가 변경 기록 남기기', async () => { const r = await LG(S, SA).add({ at: ST(), by: S.uid, name: '시험직원', role: 'staff', lines: [{ d: 'rolls', t: '입고 · 시험' }], n: 1, v: 1 }); logId = r.id; });
    await expectDenied('16-2. 직원S가 사장 계정번호로 기록 남기기', () => LG(S, SA).add({ at: ST(), by: A.uid, name: '사장', role: 'staff', lines: [], n: 0, v: 1 }));
    await expectDenied('16-3. 직원S가 역할을 사장으로 속여 기록', () => LG(S, SA).add({ at: ST(), by: S.uid, name: '시험직원', role: 'owner', lines: [], n: 0, v: 1 }));
    await expectDenied('16-4. 직원S가 변경 기록 보기', () => LG(S, SA).get());
    await expectOk('16-5. 사장A가 변경 기록 보기', () => LG(A, SA).get());
    await expectDenied('16-6. 사장A가 기록 고치기', () => LG(A, SA).doc(logId || 'x').update({ name: '바꿈' }));
    await expectDenied('16-7. 사장A가 기록 지우기', () => LG(A, SA).doc(logId || 'x').delete());
    await expectDenied('16-8. 사장B가 A 가게에 기록 남기기', () => LG(B, SA).add({ at: ST(), by: B.uid, name: 'x', role: 'owner', lines: [], n: 0, v: 1 }));
    await expectDenied('16-9. 운영자도 기록 지우기 못 함', () => ADM.db.collection('shops').doc(SA).collection('logs').doc(logId || 'x').delete());
    await expectDenied('17. 직원S가 직원 목록 보기', () => S.db.collection('shops').doc(SA).collection('members').get());
    await expectDenied('18. 직원S가 자기를 사장으로 바꾸기', () => D(S, SA, 'members', S.uid).update({ role: 'owner' }));
    await expectDenied('19. 직원S가 백업 삭제', () => D(S, SA, 'backups', 'x').delete());
    await expectDenied('20. 직원S가 다른 계정을 자기 가게에 연결', () => S.db.collection('users').doc(B.uid).set({ shopId: SA }));
    await expectDenied('21. 사장A가 자기 역할 바꾸기', () => D(A, SA, 'members', A.uid).update({ role: 'staff' }));
    await expectOk('22. 가게 이름표(장부 링크용)는 로그인 없이 읽힘', async () => { await D(A, SA, 'public', 'brand').set({ name: '시험' }); const p = firebase.initializeApp(cfg, 'anon' + rnd); await p.firestore().collection('shops').doc(SA).collection('public').doc('brand').get(); });
    await expectDenied('23. 로그인 안 한 사람이 장부 읽기', () => firebase.app('anon' + rnd).firestore().collection('shops').doc(SA).collection('data').doc('rolls').get());
    await expectOk('24. 사장A가 직원S 사용 중지', () => D(A, SA, 'members', S.uid).update({ active: false }));
    await expectDenied('25. 사용 중지된 직원S가 장부 읽기', () => D(S, SA, 'data', 'rolls').get());
    await expectOk('26. 운영자가 A 가게 사용 중지', () => approve(SA, 'suspended'));
    await expectDenied('27. 사용 중지된 가게 사장A가 장부 저장', () => D(A, SA, 'data', 'rolls').set({ data: '[]', rev: 5, stamp: 2 }));
    await expectOk('28. 사용 중지돼도 장부 읽기는 됨 (내용 보관)', () => D(A, SA, 'data', 'rolls').get());
    await expectOk('29. 운영자가 A 가게 다시 사용', () => approve(SA, 'active'));
    await expectOk('30. 다시 사용 후 사장A 저장 됨', () => D(A, SA, 'data', 'rolls').set({ data: '[]', rev: 6, stamp: 2 }));
    // 프리미엄(홍보·고객 페이지): 운영자만 켬, 안 켠 가게는 고객 페이지를 올리지도 보이지도 않음, 장부 링크는 모든 가게
    const anonPub = (id) => firebase.app('anon' + rnd).firestore().collection('shops').doc(SA).collection('public').doc(id).get();
    await expectDenied('31. 사장A가 스스로 프리미엄 켜기', () => A.db.collection('shops').doc(SA).update({ plan: 'premium' }));
    await expectDenied('32. 프리미엄 아닌 가게가 고객 페이지 올리기', () => D(A, SA, 'public', 'pubIndex').set({ data: '{}' }));
    await expectOk('33. 프리미엄 아니어도 장부 링크 올리기', () => D(A, SA, 'public', 'ledger_rt' + rnd).set({ data: '{}' }));
    await expectOk('34. 장부 링크는 로그인 없이 열림', () => anonPub('ledger_rt' + rnd));
    await expectDenied('35. 운영자도 이상한 구독값은 못 넣음', () => ADM.db.collection('shops').doc(SA).update({ plan: 'gold' }));
    await expectOk('36. 운영자가 A 가게 프리미엄 켜기', () => ADM.db.collection('shops').doc(SA).update({ plan: 'premium', planAt: new Date().toISOString() }));
    await expectOk('37. 프리미엄 가게는 고객 페이지 올리기 됨', () => D(A, SA, 'public', 'pubIndex').set({ data: '{}' }));
    await expectOk('38. 고객 페이지는 로그인 없이 열림', () => anonPub('pubIndex'));
    await expectOk('39. 운영자가 프리미엄 끄기', () => ADM.db.collection('shops').doc(SA).update({ plan: 'basic', planAt: new Date().toISOString() }));
    await expectDenied('40. 프리미엄 끄면 고객 페이지 바로 닫힘', () => anonPub('pubIndex'));
  } catch (e) { log(false, '검사 준비 실패', e.code || e.message); }
  document.getElementById('sum').innerHTML = fail === 0 ? `<span class="ok">전부 통과 (${pass}개)</span>` : `<span class="bad">실패 ${fail}개 / 통과 ${pass}개</span>`;
}
</script>
</body>
</html>
