.bar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--paper); border-top:1px solid var(--hair); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
.bar { display:flex; gap:8px; justify-content:center; }
.bar a { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; max-width:342px; background:var(--brand); color:#fff; border-radius:12px; padding:14px 0; font-size:16px; font-weight:800; white-space:nowrap; }
.bar a.ch { background:#fee500; color:#191919; }
.bar small { display:block; text-align:center; font-size:12px; color:var(--muted); margin-top:6px; }
</style>

<script>
const THEMES = { // [새 시스템] 거래처가 보는 화면(고객 페이지·장부 링크·카톡용 재고표 이미지) 색 세트 - 글씨가 잘 보이게 미리 맞춘 5가지

const RQ_QUICK = ['매장으로 올려주세요', '퀵으로 보내주세요', '택배로 보내주세요']; // 누르면 메모에 바로 들어감 (손님이 안 쳐도 되게)
function rqQuick(i) { rqSync(); const t = RQ_QUICK[i]; if (!rq.memo.includes(t)) rq.memo = (rq.memo.trim() ? rq.memo.trim() + ', ' : '') + t; rqPaint(); }
function rqPickCol(i) { rqSync(); if (rq.pick.has(i)) rq.pick.delete(i); else if (rq.pick.size < 20) rq.pick.add(i); rq.cols = rq.cl.filter((c, j) => rq.pick.has(j)).join(', '); rq.err = ''; rqPaint(); } // 신상·Best: 가게 컬러 목록에서 눌러서 고르기
function rqSet(k, val) { rqSync(); rq[k] = val; rq.err = ''; rqPaint(); }
function rqText() {
  return `[${RQ_KIND[rq.kind]} 요청] ${rq.item}${rq.cols.trim() ? ' · ' + rq.cols.trim() : ''}${rq.kind === 'sample' ? ` · 각 ${rq.qty}야드` : ''}${rq.memo.trim() ? ' · ' + rq.memo.trim() : ''}${rq.name.trim() ? ' — ' + rq.name.trim() : ''}${rqTelClean(rq.tel) ? ' ' + rqTelClean(rq.tel) : ''}`;
}
function rqPaint() {
  const el = document.getElementById('rqsheet'); if (!rq) { el.innerHTML = ''; return; }
  document.body.style.overflow = 'hidden';
  const tel = BRAND.tel.replace(/[^0-9]/g, '');
  const alt = BRAND.kakaoUrl ? `<button type="button" class="rq-go" onclick="rqKakao()">카톡으로 보내기</button>` : (tel ? `<a class="rq-go" style="text-align:center;text-decoration:none" href="tel:${tel}">전화로 문의하기</a>` : '');
  if (rq.step === 'done') {
    el.innerHTML = `<div class="rq-ov" onclick="if(event.target===this)rqClose()"><div class="rq-sh"><div class="rq-done"><div class="big">✓</div><b>요청이 전달됐어요</b><p>${rq.kind === 'restock' ? `입고되면 ${esc(BRAND.name || '가게')}에서 연락드릴게요.` : `${esc(BRAND.name || '가게')}에서 확인 후 연락드릴게요.`}</p></div>${BRAND.kakaoUrl ? `<button type="button" class="rq-go" onclick="rqKakao()">카톡으로도 알리기</button><div class="rq-cap">누르면 요청 내용이 복사돼요. 채팅창에 붙여넣기만 하면 돼요.</div><button type="button" class="rq-sub" onclick="rqClose()">닫기</button>` : `<button type="button" class="rq-go" onclick="rqClose()">확인</button>`}</div></div>`;
    return;
  }
  const memoPh = rq.kind === 'ask' ? '예: 재입고 언제 되나요? 300야드 가능할까요?' : rq.kind === 'restock' ? '예: 300야드 필요해요' : '예: 매장으로 올려주세요';
  el.innerHTML = `<div class="rq-ov" onclick="if(event.target===this)rqClose()"><div class="rq-sh">
    <h3>요청하기</h3>
    <div class="what"><b style="color:var(--ink)">${esc(rq.item)}</b>${!rq.free && rq.cols ? ' · ' + esc(rq.cols) : ''}</div>
    <label>무엇이 필요하세요?</label>
    <div class="rq-seg">${Object.keys(RQ_KIND).filter(k => k !== 'restock' || rq.hasOut).map(k => `<button type="button" class="${rq.kind === k ? 'on' : ''}" onclick="rqSet('kind','${k}')">${RQ_KIND[k]}</button>`).join('')}</div>
    ${rq.kind === 'sample' ? `<label>컬러당 수량</label><div class="rq-seg">${[1, 2, 3, 5].map(n => `<button type="button" class="${rq.qty === n ? 'on' : ''}" onclick="rqSet('qty',${n})">${n}야드</button>`).join('')}</div>` : ''}
    ${rq.free && rq.cl.length ? `<label>컬러 고르기 (여러 개 가능)</label><div class="rq-cols">${rq.cl.map((c, i) => `<button type="button" class="${rq.pick.has(i) ? 'on' : ''}" onclick="rqPickCol(${i})">${esc(c)}</button>`).join('')}</div>`
      : rq.free ? `<label>컬러 (번호나 이름)</label><input id="rq-cols" maxlength="100" placeholder="예: 3번, 5번 블랙" value="${esc(rq.cols)}">` : ''}
    ${rq.editWho ? `<label>${TO ? '이름 (선택)' : '상호 (필수)'}</label><input id="rq-name" maxlength="30" placeholder="${TO ? '예: 디자이너 김지은' : '예: 한빛봉제, 디자이너 김지은'}" autocomplete="${TO ? 'name' : 'organization'}" value="${esc(rq.name)}">
    <label>연락받을 번호 (필수)</label><input id="rq-tel" type="tel" inputmode="tel" maxlength="20" placeholder="예: 010-1234-5678" autocomplete="tel" value="${esc(rq.tel)}">
    <div class="rq-cap" style="text-align:left">한 번 적으면 이 휴대폰에 기억돼요.</div>`
    : `<div class="rq-who"><span>보내는 분</span><b>${esc(rq.name || '')}</b><em>${esc(rq.tel)}</em><button type="button" onclick="rqSet('editWho', true)">바꾸기</button></div>`}
    <label>${rq.kind === 'ask' ? '문의 내용' : '메모 (선택)'}</label><textarea id="rq-memo" maxlength="200" placeholder="${memoPh}">${esc(rq.memo)}</textarea>
    ${rq.kind === 'ask' || rq.kind === 'restock' ? '' : `<div class="rq-quick">${RQ_QUICK.map((t, i) => `<button type="button" onclick="rqQuick(${i})">${esc(t)}</button>`).join('')}</div>`}
    ${rq.err ? `<div class="rq-err">${esc(rq.err)}</div>` : ''}
    ${rq.failed ? alt : `<button type="button" class="rq-go" id="rq-go" onclick="rqSend()"${rqBusy ? ' disabled' : ''}>${rqBusy ? '보내는 중…' : '요청 보내기'}</button>`}
    <button type="button" class="rq-sub" onclick="rqClose()">닫기</button>
  </div></div>`;
}
async function rqSend() {
  rqSync(); if (!rq || rqBusy) return;
  const name = rq.name.replace(/\s+/g, ' ').trim().slice(0, 30);
  if (!name && !TO) { rq.err = '상호를 적어주세요.'; rq.editWho = true; return rqPaint(); }
  if (!rqTelOk(rq.tel)) { rq.err = '연락받을 번호를 적어주세요.'; rq.editWho = true; return rqPaint(); }
  if (rq.free && rq.kind !== 'ask' && !rq.cols.trim()) { rq.err = rq.cl.length ? '컬러를 하나 이상 골라주세요.' : '컬러 번호나 이름을 적어주세요.'; return rqPaint(); }
  if (Date.now() - rqLastAt < 15000) { rq.err = '방금 요청을 보냈어요. 잠시 후 다시 보내주세요.'; return rqPaint(); }
  rqBusy = true; rq.err = ''; rqPaint();
  const tel = rqTelClean(rq.tel);
  const doc = { at: firebase.firestore.FieldValue.serverTimestamp(), kind: rq.kind, item: rq.item.slice(0, 60), cols: rq.cols.replace(/\s+/g, ' ').trim().slice(0, 300), qty: rq.kind === 'sample' ? rq.qty : 0, name, memo: rq.memo.trim().slice(0, 200), ...(tel ? { tel } : {}), ...(TO ? { to: TO } : {}), done: false, v: 1 };
  try {
    if (!db) throw new Error('nodb');
    await db.collection('shops').doc(SHOP_ID).collection('requests').add(doc);
    try { localStorage.setItem('rqWho_' + SHOP_ID, JSON.stringify({ name, tel })); } catch (e) { /* 기억 못 해도 괜찮음 */ }
    rqLastAt = Date.now(); rq.step = 'done'; rq.name = name; rq.tel = tel; rq.editWho = false;
    if (!rq.free) { rqSel.clear(); document.querySelectorAll('.sw.pick').forEach(x => x.classList.remove('pick')); }
  } catch (e) {
    rq.failed = true; rq.err = BRAND.kakaoUrl ? '요청을 보내지 못했어요. 아래 버튼을 누르면 내용이 복사되고 카톡 채팅이 열려요. 붙여넣기만 하면 돼요.' : '요청을 보내지 못했어요. 전화로 문의해주세요.';
  }
  rqBusy = false; rqPaint();
}
async function rqKakao() { // 채널 채팅은 글을 미리 채울 수 없어서 문구를 복사해 두고 엶
  rqSync(); const t = rqText(); let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (e2) { ok = false; }
  }
  const sh = document.querySelector('.rq-sh');
  if (sh) sh.insertAdjacentHTML('beforeend', `<div class="rq-err" style="color:var(--ink)">${ok ? '요청 문구를 복사했어요. 채팅창에 붙여넣어 주세요.' : '채팅창에 아래 문구를 보내주세요.<br>' + esc(t)}</div>`);
  if (BRAND.kakaoUrl) setTimeout(() => { location.href = rqChatUrl(); }, ok ? 900 : 2500);
}
window.addEventListener('popstate', () => { if (rq) rqClose(); });
function o_open_ok(sd) { try { return sd.exists && JSON.parse(sd.data().data || '{}').open === true; } catch (e) { return false; } }
async function boot() {
  loadErr = false; idx = null; sIdx = null; sErr = false; render();
  try {
    if (!db) { firebase.initializeApp(cfg); db = firebase.firestore(); try { await firebase.auth().signInAnonymously(); } catch (e) { /* 규칙이 열려 있으면 인증 없이도 읽힘 */ } }
    await loadBrand();
    { const bar = document.getElementById('bar'); const tel = BRAND.tel.replace(/[^0-9]/g, ''); bar.innerHTML = (tel ? `<a href="tel:${tel}">📞 전화하기</a>` : '') + (BRAND.kakaoUrl ? `<a class="ch" href="${esc(BRAND.kakaoUrl)}">💬 채널로 돌아가기</a>` : ''); if (!bar.innerHTML) bar.style.display = 'none'; }
    const d = await pubDocs().doc('pubIndex').get();
    let entries = [];
    if (d.exists) { try { const o = JSON.parse(d.data().data || '{}'); entries = Array.isArray(o.entries) ? o.entries : []; } catch (e) { throw e; } }
    idx = { entries };
    try { // 재고 탭: 서버의 최신 재고 상태 (실패해도 신상/Best는 그대로 보임)
      const sd = await pubDocs().doc('pubstock_idx').get();
      let items = [];
      let at = '';
      if (sd.exists) { const o = JSON.parse(sd.data().data || '{}'); items = Array.isArray(o.items) ? o.items : []; at = [o.checkedAt, o.updatedAt].filter(x => typeof x === 'string' && !isNaN(Date.parse(x))).sort().pop() || ''; }
      sIdx = { items: (o_open_ok(sd) ? items : []), open: o_open_ok(sd), at };
    } catch (e) { sErr = true; }
  } catch (e) { loadErr = true; idx = null; }
  render();
}
boot();
</script>
</body>
</html>
