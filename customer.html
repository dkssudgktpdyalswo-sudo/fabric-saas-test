<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer-when-downgrade">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#efeaea">
<title>백야 BAEK YA</title>
<style>
:root { --ink:#3a3636; --brand:#595959; --muted:#7d7676; --hair:#ddd5d5; --paper:#efeaea; --strip:#f6f2f2; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; }
body { max-width:720px; margin:0 auto; min-height:100vh; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }
a { color:inherit; text-decoration:none; }
.top { position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:2px solid var(--brand); }
.brand { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 8px; }
.brand img { height:20px; display:block; }
.brand .loc { font-size:12px; color:var(--muted); }
.tabs { display:flex; padding:0 8px; }
.tabs a { flex:1; text-align:center; padding:11px 0 12px; font-size:16px; font-weight:700; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-2px; }
.tabs a.on { color:var(--ink); border-bottom-color:var(--brand); }
.sub { padding:12px 14px 2px; }
.seg { display:flex; background:#e3dcdc; border-radius:10px; padding:3px; }
.seg a { flex:1; text-align:center; font-size:15px; font-weight:700; padding:9px 0; border-radius:8px; color:var(--muted); }
.seg a.on { background:var(--brand); color:#fff; }
.search { width:100%; border:1px solid var(--hair); background:#fff; border-radius:10px; padding:12px 14px; font-size:16px; color:var(--ink); outline:none; }
.list { padding:6px 14px 14px; }
.card { display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--hair); border-radius:12px; padding:12px; margin-top:10px; }
.card:active { background:var(--strip); }
.th { width:72px; height:72px; border-radius:10px; flex:none; object-fit:cover; border:1px solid rgba(0,0,0,.1); background:#eceae4; }
.meta { flex:1; min-width:0; }
.tag { display:inline-block; background:var(--brand); color:#fff; font-size:11px; font-weight:800; letter-spacing:1.5px; padding:1px 7px; border-radius:4px; margin-bottom:4px; }
.nm { font-size:19px; font-weight:800; line-height:1.2; letter-spacing:-.3px; word-break:keep-all; overflow-wrap:anywhere; }
.ds { font-size:13px; color:var(--muted); margin-top:4px; }
.chev { color:#b5adad; font-size:26px; flex:none; line-height:1; }
.empty, .msg { text-align:center; color:var(--muted); font-size:15px; padding:64px 20px; line-height:1.7; }
.msg button { margin-top:14px; border:none; background:var(--brand); color:#fff; border-radius:10px; padding:11px 22px; font-size:15px; font-weight:700; }
.skel { height:96px; border-radius:12px; margin:10px 14px 0; background:linear-gradient(90deg,#e8e2e2,#f1ecec,#e8e2e2); background-size:200% 100%; animation:sh 1.2s infinite; }
@keyframes sh { to { background-position:-200% 0; } }
.dhead { position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:2px solid var(--brand); display:flex; align-items:center; gap:4px; padding:6px 10px 6px 4px; }
.dhead .back { width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--ink); border:none; background:none; }
.dhead .t { font-size:19px; font-weight:800; letter-spacing:-.3px; word-break:keep-all; overflow-wrap:anywhere; }
.pages img { display:block; width:100%; height:auto; }
.mat { display:block; width:calc(100% - 32px); margin:12px 16px 0; border-radius:12px; aspect-ratio:4/3; object-fit:cover; background:#eceae4; }
.pages .ph { width:100%; aspect-ratio:3/4; background:linear-gradient(90deg,#e8e2e2,#f1ecec,#e8e2e2); background-size:200% 100%; animation:sh 1.2s infinite; }
.pages > * + * { margin-top:8px; }
.chip { display:inline-block; font-size:11.5px; font-weight:800; border-radius:5px; padding:1px 7px; line-height:1.5; background:#e6e1e1; color:#7d7676; margin-top:6px; }
.sgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:10px 14px; }
.sw { background:#fff; border:1px solid var(--hair); border-radius:12px; overflow:hidden; }
.sw .ph { aspect-ratio:1/1; background-size:cover; background-position:center; background-color:#e8e2e2; position:relative; }
.sw .no { font-weight:800; font-size:15px; padding:6px 8px 0; word-break:keep-all; overflow-wrap:anywhere; line-height:1.25; }
.sw .vh { display:grid; grid-template-columns:1fr 1fr; margin-top:5px; border-top:1px solid var(--hair); }
.sw .vh .h { padding:5px 8px 0; min-width:0; }
.sw .vh .h + .h { border-left:1px solid var(--hair); }
.sw .vh .l { font-size:13px; font-weight:700; color:var(--ink); }
.sw .vh .h.out .l, .sw .vh .h.low .l { color:#a39c9c; }
.sw .vh .h.out .l { text-decoration:line-through; }
.sw .vh .chip { margin-top:3px; font-size:10px; padding:1px 4px; white-space:nowrap; letter-spacing:-.4px; }
.sw .st { padding:3px 8px 0; }
.sw .st .chip { margin-top:0; }
.sw::after { content:''; display:block; height:8px; }
.sw.out .ph, .sw.low .ph { filter:grayscale(1); opacity:.5; }
.sw.out .no { color:#a39c9c; text-decoration:line-through; }
.sw.low .no { color:#8a8383; }
.sw .x { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; color:#6b6565; font-size:16px; letter-spacing:1px; }
.tog { display:flex; justify-content:space-between; align-items:center; padding:12px 16px 0; }
.tog button { border:none; background:none; display:flex; gap:8px; align-items:center; font-size:14px; font-weight:700; color:var(--ink); font-family:inherit; }
.tog .sv { width:42px; height:24px; border-radius:12px; background:#aaa; position:relative; flex:none; }
.tog .sv::after { content:''; position:absolute; left:2px; top:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; }
.tog .sv.on { background:var(--brand); } .tog .sv.on::after { left:20px; }
.note { padding:8px 16px 14px; font-size:12.5px; color:var(--muted); line-height:1.6; }
.bar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--paper); border-top:1px solid var(--hair); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
.bar { display:flex; gap:8px; justify-content:center; }
.bar a { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; max-width:342px; background:var(--brand); color:#fff; border-radius:12px; padding:14px 0; font-size:16px; font-weight:800; white-space:nowrap; }
.bar a.ch { background:#fee500; color:#191919; }
.bar small { display:block; text-align:center; font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>

const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');

function params() { const q = new URLSearchParams(location.search); return { p: ['new', 'best', 'stock'].includes(q.get('p')) ? q.get('p') : 'new', i: q.get('i') || '', s: q.get('s') || '' }; }
function url(o) { const q = new URLSearchParams(); q.set('shop', SHOP_ID); q.set('p', o.p); if (o.s) q.set('s', o.s); if (o.i) q.set('i', o.i); return '?' + q.toString(); }
function go(o, replace) { scrollMap[location.search] = window.scrollY; history[replace ? 'replaceState' : 'pushState']({}, '', url(o)); render(); }
document.addEventListener('click', e => {

});
window.addEventListener('popstate', render);

function season() { const m = new Date().getMonth() + 1; return (m >= 3 && m <= 8) ? 'ss' : 'fw'; }
function isRecent(d) { const m = /^(\d\d)\.(\d\d)\.(\d\d)$/.exec(d || ''); if (!m) return false; const t = new Date(2000 + +m[1], +m[2] - 1, +m[3]); return (Date.now() - t.getTime()) / 864e5 <= 7; }

function head(p) {

  return `<a class="card" href="${url(go_)}" data-go='${JSON.stringify(go_)}'>${th}<div class="meta">${tag}<div class="nm">${esc(e.item)}</div><div class="ds">${esc(sub)}${p === 'new' && e.date ? `${sub ? ' · ' : ''}${esc(e.date)} 입고` : ''}</div></div><span class="chev">›</span></a>`;

function stockCard(e) {
  const th = e.th ? `<img class="th" src="${e.th}" alt="">` : `<div class="th" style="background:#eceae4"></div>`;
  const sub = [e.mix, e.n ? `컬러 ${e.n}` : ''].filter(Boolean).join(' · ');
  const go_ = { p: 'stock', i: e.id };

    if (c.v) { // 무지/기모 묶인 칸: 아래를 반반으로 나눠 각각의 상태를 바로 옆에 보여줌
      foot = `<div class="vh">${c.v.map(x => `<div class="h${x.s === 2 ? ' out' : x.s === 1 ? ' low' : ''}"><div class="l">${esc(x.n)}</div>${x.s > 0 ? `<span class="chip">${x.s === 2 ? '품절' : '샘플가능'}</span>` : ''}</div>`).join('')}</div>`;
    } else foot = c.s > 0 ? `<div class="st"><span class="chip">${lbl(c.s)}</span></div>` : '';
    return `<div class="sw${c.s === 2 ? ' out' : c.s === 1 ? ' low' : ''}"><div class="ph"${c.t ? ` style="background-image:url(${c.t})"` : ''}>${c.s === 2 ? '<div class="x">품절</div>' : ''}</div><div class="no">${esc(c.c)}</div>${foot}</div>`;
  }).join('') || '<div class="empty" style="grid-column:1/-1;padding:30px 0">보여줄 컬러가 없어요</div>';
}
function stockDetailBody(o) {
  const nOut = o.cols.filter(c => c.s > 0).length;
  const sub = [o.mix, `컬러 ${o.cols.length}`, o.date ? `${o.date} 입고` : ''].filter(Boolean).join(' · ');
  return (o.p ? `<img class="mat" src="${o.p}" alt="${esc(o.item)}">` : '') + `<div style="padding:10px 16px 0;font-size:13.5px;color:var(--muted)">${esc(sub)}</div>`
    + (nOut > 0 ? `<div class="tog"><button type="button" id="hideBtn"><span>품절 컬러 숨기기</span><span class="sv${hideOut ? ' on' : ''}"></span></button><span style="font-size:12px;color:var(--muted)">품절 ${nOut}</span></div>` : '')
    + `<div class="sgrid" id="sgrid">${swGrid(o)}</div><div class="note">· 재고는 수시로 바뀌어요.<br>· <b>정확한 수량은 채널을 통해 담당자분과 확인해주시길 바랍니다.</b></div>`;
}
function listView(P) {
  if (!idx) return head(P.p) + (loadErr ? `<div class="msg">불러오지 못했어요.<br>잠시 후 다시 시도해주세요.<br><button onclick="boot()">다시 불러오기</button></div>` : '<div class="skel"></div><div class="skel"></div><div class="skel"></div>');
  const all = idx.entries;
  if (P.p === 'best') {
    let s = P.s === 'fw' || P.s === 'ss' ? P.s : season();
    const cnt = k => all.filter(e => e.sec === 'best_' + k).length;
    if (!P.s && cnt(s) === 0 && cnt(s === 'fw' ? 'ss' : 'fw') > 0) s = s === 'fw' ? 'ss' : 'fw';
    const list = all.filter(e => e.sec === 'best_' + s);
    return head('best') + `<div class="sub"><div class="seg">${['fw', 'ss'].map(k => `<a href="${url({ p: 'best', s: k })}" data-go='${JSON.stringify({ p: 'best', s: k })}' class="${k === s ? 'on' : ''}">${k === 'fw' ? 'F/W' : 'S/S'}</a>`).join('')}</div></div><div class="list">${list.length ? list.map(e => cardHtml(e, 'best', s)).join('') : '<div class="empty">준비 중이에요</div>'}</div>`;
  }
  if (P.p === 'stock') {
    if (sErr) return head('stock') + `<div class="msg">재고를 불러오지 못했어요.<br>잠시 후 다시 시도해주세요.<br><button onclick="boot()">다시 불러오기</button></div>`;
    if (!sIdx) return head('stock') + '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    return head('stock') + `<div class="sub"><input class="search" id="q" type="search" placeholder="품번 검색" autocomplete="off"></div><div class="note" style="padding:10px 16px 0;">정확한 수량은 채널을 통해 담당자분과 확인해주시길 바랍니다.</div><div class="list" id="stocklist">${stockCards(sIdx.items)}</div>`;
  }
  const list = all.filter(e => e.sec === 'new');
  return head('new') + `<div class="list">${list.length ? list.map(e => cardHtml(e, 'new')).join('') : '<div class="empty">곧 신상이 올라와요</div>'}</div>`;
}
async function getPages(e) {
  if (pageCache[e.id]) return pageCache[e.id];
  const out = new Array(e.n).fill(null);
  await Promise.all(out.map(async (_, i) => {
    try { const d = await pubDocs().doc('pubpg_' + e.id + '_' + i).get(); if (!d.exists) { out[i] = ''; return; } const m = d.data(); let s = m.d || ''; for (let k = 1; k <= (m.c || 0); k++) { const x = await pubDocs().doc('pubpg_' + e.id + '_' + i + 'x' + k).get(); if (!x.exists) { s = ''; break; } s += x.data().d; } out[i] = s; } catch (err) { out[i] = ''; }
  }));
  if (out.every(Boolean)) pageCache[e.id] = out;
  return out;
}
function detailView(P) {
  const e = idx && idx.entries.find(x => x.id === P.i);
  const back = { p: P.p }; if (P.s) back.s = P.s;
  const bar = `<div class="dhead"><a class="back" href="${url(back)}" data-go='${JSON.stringify(back)}' aria-label="뒤로">‹</a><div class="t">${esc(e ? e.item : '')}</div></div>`;
  if (!idx) return bar + '<div class="skel"></div>';
  if (!e) return bar + '<div class="empty">내려간 품목이에요</div>';
  return bar + `<div class="pages" id="pages">${Array.from({ length: e.n }, (_, i) => `<div class="ph" id="ph${i}"></div>`).join('')}</div>`;
}
async function render() {
  const P = params();
  if (P.p === 'stock' && (sErr || (sIdx && !stockOpen()))) { history.replaceState({}, '', url({ p: 'new' })); return render(); } // 잠긴 재고 탭 주소로 들어오면 신상으로
  if (P.i && P.p === 'stock') {
    const e0 = sIdx && sIdx.items.find(x => x.id === P.i);
    const back = { p: 'stock' };
    app.innerHTML = `<div class="dhead"><a class="back" href="${url(back)}" data-go='${JSON.stringify(back)}' aria-label="뒤로">‹</a><div class="t">${esc(e0 ? e0.item : '')}</div></div><div id="sbody">${sIdx ? '<div class="skel"></div>' : (sErr ? '<div class="empty">불러오지 못했어요</div>' : '<div class="skel"></div>')}</div>`;
    window.scrollTo(0, 0);
    if (!e0) { if (sIdx) document.getElementById('sbody').innerHTML = '<div class="empty">내려간 품목이에요</div>'; return; }
    document.title = e0.item + ' · 백야';
    let o = sCache[e0.id];
    if (!o) { try { const d = await pubDocs().doc('pubstock_' + e0.id).get(); if (d.exists) { o = JSON.parse(d.data().data || '{}'); sCache[e0.id] = o; } } catch (err) { o = null; } }
    if (params().i !== P.i) return;
    const body = document.getElementById('sbody'); if (!body) return;
    if (!o || !Array.isArray(o.cols)) { body.innerHTML = '<div class="empty">불러오지 못했어요</div>'; return; }
    const paint = () => { body.innerHTML = stockDetailBody(o); const hb = document.getElementById('hideBtn'); if (hb) hb.addEventListener('click', () => { hideOut = !hideOut; paint(); }); };
    paint();
    return;
  }
  if (P.i) {
    app.innerHTML = detailView(P);
    window.scrollTo(0, 0);
    const e = idx && idx.entries.find(x => x.id === P.i);
    if (e) {
      document.title = e.item + ' · 백야';
      const pages = await getPages(e);
      if (params().i !== P.i) return; // 그 사이 다른 화면으로 옮겼으면 그리지 않음
      pages.forEach((d, i) => { const ph = document.getElementById('ph' + i); if (ph) ph.outerHTML = d ? `<img src="${d}" alt="${esc(e.item)} ${i + 1}">` : `<div class="empty" style="padding:30px 0">이미지를 불러오지 못했어요</div>`; });
    }
    return;
  }
  document.title = '백야 BAEK YA';
  app.innerHTML = listView(P);
  const y = scrollMap[location.search]; window.scrollTo(0, y || 0);
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', () => {
    const k = norm(q.value), list = ((sIdx && sIdx.items) || []).filter(e => !k || norm(e.item).includes(k));
    document.getElementById('stocklist').innerHTML = list.length ? list.map(stockCard).join('') : '<div class="empty">검색 결과가 없어요</div>';
  });
}
function o_open_ok(sd) { try { return sd.exists && JSON.parse(sd.data().data || '{}').open === true; } catch (e) { return false; } }
async function boot() {
  loadErr = false; idx = null; sIdx = null; sErr = false; render();
  try {
    if (!db) { firebase.initializeApp(cfg); db = firebase.firestore(); try { await firebase.auth().signInAnonymously(); } catch (e) { /* 규칙이 열려 있으면 인증 없이도 읽힘 */ } }
    const d = await pubDocs().doc('pubIndex').get();
    let entries = [];
    if (d.exists) { try { const o = JSON.parse(d.data().data || '{}'); entries = Array.isArray(o.entries) ? o.entries : []; } catch (e) { throw e; } }
    idx = { entries };
    try { // 재고 탭: 서버의 최신 재고 상태 (실패해도 신상/Best는 그대로 보임)
      const sd = await pubDocs().doc('pubstock_idx').get();
      let items = [];
      if (sd.exists) { const o = JSON.parse(sd.data().data || '{}'); items = Array.isArray(o.items) ? o.items : []; }
      sIdx = { items: (o_open_ok(sd) ? items : []), open: o_open_ok(sd) };
    } catch (e) { sErr = true; }
  } catch (e) { loadErr = true; idx = null; }
  render();
}
boot();
</script>
