<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>가게 관리 (운영자)</title>
<style>
  :root { --primary: #2c5f7c; --primary-dark: #1e4258; --danger: #c0392b; --text: #2b2b2b; --muted: #7a7a7a; --border: #e2ddd4; --bg: #f5f3ef; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--primary); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header h1 { margin: 0; font-size: 17px; }
  header small { opacity: .8; font-size: 12px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 14px 12px 60px; }
  .card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .btn { border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .main { background: var(--primary); color: #fff; } .sub { background: #ecebe8; color: #444; } .danger { background: #fdecea; color: var(--danger); }
  .btn.big { width: 100%; padding: 14px; font-size: 15px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--border); background: #fff; border-radius: 18px; padding: 7px 14px; font-size: 13px; font-weight: 700; color: #555; cursor: pointer; }
  .tabs button.on { background: var(--primary-dark); color: #fff; border-color: var(--primary-dark); }
  .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .nm { font-size: 16px; font-weight: 700; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.6; word-break: break-all; }
  .chip { display: inline-block; border-radius: 10px; padding: 2px 8px; font-size: 11.5px; font-weight: 800; margin-left: 6px; vertical-align: 2px; }
  .chip.pending { background: #fdf0d8; color: #9a5b00; } .chip.active { background: #e6f2ea; color: #1e6b3d; } .chip.suspended { background: #fdecea; color: var(--danger); }
  .acts { display: flex; gap: 6px; flex: none; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
  code { background: #f1efea; padding: 3px 6px; border-radius: 5px; font-size: 13px; word-break: break-all; }
  ol { padding-left: 20px; line-height: 1.9; font-size: 14px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; display: none; z-index: 10; }
</style>
</head>
<body>
<header><div><h1>가게 관리 (운영자)</h1><small id="who">로그인 필요</small></div><button class="btn sub" id="outBtn" style="display:none;" onclick="firebase.auth().signOut().then(() => location.reload())">로그아웃</button></header>
<div class="wrap" id="app">
  <div class="card"><p style="margin-top:0;">서비스 운영자(사장님) 구글 계정으로 들어오세요. 새로 가입한 가게를 승인하거나 사용을 중지할 수 있습니다.</p>
  <button class="btn main big" onclick="login()">구글로 로그인</button></div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const cfg = { apiKey: "AIzaSyCeWjdi2yBaBsiVSydDYHDAmQAT4hsGs6I", authDomain: "fabric-saas-test.firebaseapp.com", projectId: "fabric-saas-test", appId: "1:93481473112:web:5f88067e0e01dfba24e62d" };
firebase.initializeApp(cfg);
const db = firebase.firestore();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = 'none', 2600); }
const LABEL = { pending: '승인 대기', active: '사용 중', suspended: '사용 중지' };
let SHOPS = [], FILTER = 'pending';

async function login() {
  try { await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch (e) { toast('로그인하지 못했습니다 (' + (e.code || e.message) + ')'); }
}
firebase.auth().onAuthStateChanged(async (user) => {
  if (!user) return;
  $('who').textContent = user.email || ''; $('outBtn').style.display = '';
  let isAdmin = false;
  try { isAdmin = (await db.collection('admins').doc(user.uid).get()).exists; } catch (e) { isAdmin = false; }
  if (!isAdmin) { showSetup(user); return; }
  await load();
});
// 처음 한 번: 이 구글 계정을 운영자로 등록하는 방법 (앱에서는 못 만들게 막아둠 → 콘솔에서 직접)
function showSetup(user) {
  $('app').innerHTML = `<div class="card">
    <div class="nm">운영자 등록이 필요합니다 (처음 한 번만)</div>
    <p class="meta">보안을 위해 운영자는 프로그램 안에서 스스로 될 수 없고, 파이어베이스 화면에서 사장님이 직접 등록해야 합니다.</p>
    <p style="margin-bottom:4px;">내 계정 번호</p>
    <div style="display:flex;gap:6px;align-items:center;"><code id="uid">${esc(user.uid)}</code><button class="btn sub" onclick="navigator.clipboard.writeText('${esc(user.uid)}').then(() => toast('복사 완료'))">복사</button></div>
    <ol>
      <li>console.firebase.google.com → <b>fabric-saas-test</b> → 왼쪽 <b>Firestore Database</b></li>
      <li><b>+ 컬렉션 시작</b> → 컬렉션 ID: <code>admins</code></li>
      <li>문서 ID: 위 <b>내 계정 번호</b> 붙여넣기</li>
      <li>필드: <code>name</code> / 값: 아무 글자 (예: 사장님) → <b>저장</b></li>
      <li>이 화면을 새로고침</li>
    </ol></div>`;
}
async function load() {
  $('app').innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    const snap = await db.collection('shops').get();
    SHOPS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // 예전 가게는 사장 이메일이 가게 문서에 없어서 사장 계정에서 찾아옴
    await Promise.all(SHOPS.filter(s => !s.ownerEmail && s.ownerUid).map(async s => {
      try { const m = await db.collection('shops').doc(s.id).collection('members').doc(s.ownerUid).get(); if (m.exists) s.ownerEmail = m.data().email || ''; } catch (e) { /* 없음 */ }
    }));
  } catch (e) { $('app').innerHTML = `<div class="card">가게 목록을 불러오지 못했습니다 (${esc(e.code || e.message)})<br>보안 규칙을 새로 게시했는지 확인해 주세요.</div>`; return; }
  if (!SHOPS.some(s => (s.status || 'active') === 'pending') && FILTER === 'pending') FILTER = 'all';
  render();
}
function render() {
  const st = s => s.status || 'active';
  const count = k => k === 'all' ? SHOPS.length : SHOPS.filter(s => st(s) === k).length;
  const list = SHOPS.filter(s => FILTER === 'all' || st(s) === FILTER)
    .sort((a, b) => (st(a) === 'pending' ? 0 : 1) - (st(b) === 'pending' ? 0 : 1) || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  const tabs = [['pending', '승인 대기'], ['active', '사용 중'], ['suspended', '사용 중지'], ['all', '전체']]
    .map(([k, l]) => `<button class="${FILTER === k ? 'on' : ''}" onclick="FILTER='${k}'; render()">${l} ${count(k)}</button>`).join('');
  const cards = list.map(s => {
    const k = st(s);
    const acts = k === 'pending' ? `<button class="btn main" onclick="setStatus('${esc(s.id)}', 'active', this)">승인</button><button class="btn danger" onclick="setStatus('${esc(s.id)}', 'suspended', this)">거절</button>`
      : k === 'active' ? `<button class="btn danger" onclick="setStatus('${esc(s.id)}', 'suspended', this)">사용 중지</button>`
      : `<button class="btn main" onclick="setStatus('${esc(s.id)}', 'active', this)">다시 사용</button>`;
    return `<div class="card"><div class="row"><div style="min-width:0;">
      <div class="nm">${esc(s.name || '(이름 없음)')}<span class="chip ${k}">${LABEL[k]}</span></div>
      <div class="meta">가게 코드 ${esc(s.id)} · 사장 ${esc(s.ownerName || '')} ${esc(s.ownerEmail || '')}<br>신청 ${esc(String(s.createdAt || '').slice(0, 10))}${s.statusAt ? ` · 상태 변경 ${esc(String(s.statusAt).slice(0, 10))}` : ''}</div>
    </div><div class="acts">${acts}</div></div></div>`;
  }).join('');
  $('app').innerHTML = `<div class="tabs">${tabs}</div>${cards || '<div class="empty">해당하는 가게가 없습니다</div>'}
    <p class="meta" style="text-align:center;">승인하면 그 가게 화면이 저절로 열립니다. 사용 중지해도 장부 내용은 지워지지 않습니다.</p>`;
}
// 중지·거절은 실수 방지로 한 번 더 누르게
async function setStatus(id, status, btn) {
  if (status === 'suspended' && btn.dataset.sure !== '1') {
    btn.dataset.sure = '1'; const old = btn.textContent; btn.textContent = '한 번 더 누르면 중지';
    setTimeout(() => { if (btn.isConnected) { btn.dataset.sure = ''; btn.textContent = old; } }, 3000); return;
  }
  btn.disabled = true;
  try {
    await db.collection('shops').doc(id).update({ status, statusAt: new Date().toISOString() });
    const s = SHOPS.find(x => x.id === id); if (s) { s.status = status; s.statusAt = new Date().toISOString(); }
    toast(status === 'active' ? '승인 완료' : '사용 중지 완료'); render();
  } catch (e) { btn.disabled = false; toast('바꾸지 못했습니다 (' + (e.code || e.message) + ')'); }
}
</script>
</body>
</html>
